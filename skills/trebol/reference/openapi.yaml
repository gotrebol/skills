          example: "ubos"
        url:
          type: string
          description: URL que apunta a la pagina correspondiente al paso del flujo. el mismo debe ser uno de los siguientes, de lo contrario se generara un error.
          enum:
            - "/(main-flow)/start/[accountId]/[flowId]"
            - "/(main-flow)/verification/[id]/docs-v2"
            - "/(main-flow)/verification/[id]/ubos"
            - "/(main-flow)/verification/[id]/forms"
            - "/(main-flow)/verification/[id]/check-out"
        text:
          type: string
          description: Texto que se mostrara en el paso del flujo.
          example: "Propietarios reales"
        isPrimary:
          type: boolean
          description: Indica si el paso es el principal del flujo.
        isLinkable:
          type: boolean
          description: Indica si el paso es direccionable a este paso especifico, si es true, el usuario se podra dirigir a este paso directamente desde su link.
        requestUboAddress:
          type: boolean
          description: Especificamente para el flujo de Ubos, si este valor es true, se le pedira al usuario un comprobante de domicilio para cada UBO.
    VerificationTemplate:
      type: object
      properties:
        id:
          type: string
          description: ID con el que se identifica el template de verificación.
        items:
          type: array
          description: Lista de items que conforman el template de verificación
          items:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                description: Tipo de item de verificación
                example: "generic"
              options:
                type: object
                properties:
                  is_optional:
                    type: boolean
                    description: Indica si el item es opcional, si es true, el item no sera requerido para que finalice la verificacion.
                  ubos_threshold:
                    type: integer
                    description:
                      Indica el porcentaje mínimo que debe tener un accionista para tener que ser declarado en la sección de UBOs.
                      **Aplicara solo para items de tipo `ubos` y es opcional**.
                    example: 25
                  ubos_form_schema:
                    type: string
                    enum:
                      - "mx_form"
                      - "co_form"
                    description:
                      Especifica el esquema de formulario que se debe usar para la sección de UBOs.
                      Para más información sobre los esquemas de formulario, consulta la sección [Items del flujo](/guia-devs/crear-verificaciones/via-widget/items#forms).
                      **Aplicara solo para items de tipo `ubos` y es opcional**.
                    example: "mx_form"
                  ubos_schema_id:
                    type: string
                    description:
                      ID de un esquema de formulario personalizado creado con el endpoint de esquemas de formularios.
                      Cuando se especifica, el widget usa este esquema en lugar de los predeterminados (`mx_form` / `co_form`).
                      El esquema debe existir en la cuenta. Debe ser diferente a `mx_form` o `co_form`(Estos se especifican con `ubos_form_schema`).
                      **Aplicará solo para items de tipo `ubos` y es opcional**.
                    example: "ubos-custom-001"
                  schema_id:
                    type: string
                    description: |
                      ID del esquema de formulario. **Requerido para items de tipo `forms`**.
                      Debe corresponder a un esquema de formulario existente en la cuenta.
                    example: "some-test-form-schema"
                additionalProperties: true
        options:
          type: object
          description: Opciones adicionales para la verificacion.
          properties:
            creator_email:
              type: string
              format: email
              description: Email del creador de la verificacion, el usuario empresarial.
            next_steps_checkout:
              type: array
              description: Lista de pasos a seguir para tu prospecto al finalizar el flujo de onboarding. Se puede enviar un array vacío para no mostrar ningún paso.
              example:
                [
                  {
                    "title": "Documentos adicionales",
                    "description": "Es posible que se necesiten documentos adicionales para completar tu onboarding. En ese caso nos pondremos en contacto contigo.",
                  },
                  {
                    "title": "Firma del contrato",
                    "description": "Cuando se complete toda la información, un representante de ventas se pondrá en contacto contigo para firmar el contrato.",
                  },
                ]
              items:
                type: object
                properties:
                  title:
                    type: string
                    description: Titulo del paso.
                    example: "Documentos adicionales"
                  description:
                    type: string
                    description: Descripción del paso.
                    example: "Es posible que se necesiten documentos adicionales para completar tu onboarding. En ese caso nos pondremos en contacto contigo."
          additionalProperties: true
    AllowedItemType:
      type: string
      description: Los siguientes son items basados en documentos.
      enum:
        - "aa_mx"
