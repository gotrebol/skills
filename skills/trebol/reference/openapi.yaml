                success: false
                message: "The specified file_url is invalid. Ensure it is public and downloadable."
                code: invalid_item_options_file_url
                timestamp: "2025-01-01T12:34:56.000Z"
    UnauthorizedError:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            Unauthorized:
              summary: Falta API key o inválida
              value:
                success: false
                message: "Unauthorized"
                code: UNAUTHORIZED
                timestamp: "2025-01-01T12:34:56.000Z"
    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            NotFound:
              summary: Recurso inexistente
              value:
                success: false
                message: "Entity not found"
                code: NOT_FOUND
                timestamp: "2025-01-01T12:34:56.000Z"
