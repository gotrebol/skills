        external_identities:
          {
            $ref: "#/components/schemas/PublicExternalIdentities",
            nullable: true,
          }
        gender: { type: string, nullable: true }
        birth_date: { type: string, nullable: true }
        birth_entity: { type: string, nullable: true }

    V2CompanyCapital:
      type: object
      properties:
        fixed_value: { type: string }
        fixed_shares: { type: string }
        fixed_value_currency: { type: string }
        variable_value: { type: string }
        variable_shares: { type: string }
        variable_value_currency: { type: string }
        total_value: { type: string }
        total_shares: { type: string }
        total_value_currency: { type: string }

    V2ShareholdersData:
      type: object
      properties:
        shareholders:
          type: array
          items: { $ref: "#/components/schemas/V2Shareholder" }
        source:
          $ref: "#/components/schemas/V2PublicSource"
          nullable: true
        capital:
          $ref: "#/components/schemas/V2CompanyCapital"
          nullable: true
        shareholders_unavailable_reason:
          type: string
          nullable: true
          enum:
            ["business_type_without_shareholders", "pending_extraction", null]
          description: |
            Por qué `shareholders` viene vacío. `business_type_without_shareholders`: el tipo de sociedad no tiene accionistas y la lista vacía es la respuesta final. `pending_extraction`: hay un acta en extracción, así que la lista vacía todavía no dice nada. `null`: no hay motivo que reportar, sea porque hay accionistas o porque el tipo de sociedad sí los tiene. Solo lleva un motivo cuando la lista está vacía. Los dos campos siempre están presentes: lo opcional es el valor, no su presencia. Nunca se omiten del objeto, ni siquiera cuando hay accionistas — en ese caso `shareholders_unavailable_reason` llega en `null`. Campo aditivo, disponible desde el 20 de agosto de 2026. Ver [Motivo cuando la lista de accionistas viene vacía](/guia-devs/uso-kyb/mexico/accionistas#motivo-sin-accionistas).
          example: null
        business_type:
          type: string
          nullable: true
          description: |
            Tipo de sociedad del que Trébol derivó el motivo, tal como está escrito en el documento. Sale del acta más reciente y, si ninguna acta lo trae, de la constancia de situación fiscal. El campo siempre está presente; su valor es el tipo de sociedad cuando Trébol lo puede resolver y `null` cuando no, también cuando el motivo es `null`. No lo compares contra tu propia lista de tipos: usa `shareholders_unavailable_reason`. Campo aditivo, disponible desde el 20 de agosto de 2026.
          example: "SOCIEDAD ANONIMA DE CAPITAL VARIABLE"
        citations:
          type: object
          description: |
            Presente solo cuando se llamó con `?with_citations=true`. Contiene la URL firmada (CloudFront) al artifact de coordenadas en S3, que mapea cada field extraído a sus `bounding_boxes` dentro del PDF original. Ver [Coordenadas de citas](/guia-devs/referencia/coordenadas-citas).
          properties:
            url:
              type: string
              format: uri
              description: |
                URL firmada y temporal. Descarga el JSON cuanto antes; si caduca, vuelve a llamar al endpoint con el flag para obtener una nueva. Si el artifact aún no se horneó para esta verificación, no se devuelve la llave citations.
              example: "https://files.gotrebol.com/{verification_id}/citations/shareholders.json?Expires=…&Signature=…"
          required:
            - url

    V2VerificationDocument:
      type: object
      properties:
        url: { type: string, format: uri, nullable: true }
        created_at: { type: string, nullable: true }
        item_type: { type: string, nullable: true }
        hash: { type: string }

    V2DocumentsData:
      type: object
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/V2VerificationDocument" }

    V2CompanySource:
      type: object
      description: |
        Además de los campos listados, cada fuente puede incluir una llave por cada extracción personalizada con resultado para ese ítem, con la forma `cp_<prompt_id>`, donde `prompt_id` es el identificador editable de la extracción personalizada. El valor es un objeto JSON acorde al esquema de la versión que produjo el resultado. Ver [Extracciones personalizadas](/producto/guias/extracciones-personalizadas).

        Los tipos de ítem personalizados no usan este mecanismo. Un ítem `cit_*` aparece en `sources` con sus campos comunes, pero sin llaves `cp_` y sin `item_value`: sus resultados de extracción y validación se leen desde el ítem, en `item_value.pipeline`. Ver [Tipos de ítem personalizados](/producto/guias/tipos-de-item-personalizados#donde-salen-los-resultados).
      additionalProperties: true
      properties:
        id: { type: number }
        type: { type: string }
        entity_name: { type: string, nullable: true }
        acta_type: { type: string, nullable: true }
        document_number: { type: string, nullable: true }
        document_date: { type: string, nullable: true }
        document_metadata:
          { type: object, additionalProperties: true, nullable: true }
        original_file_url: { type: string, format: uri, nullable: true }
        user_event_completed_at: { type: string, nullable: true }
        user_event_name: { type: string, nullable: true }
        invalidated: { type: boolean }
        options: { type: object, additionalProperties: true, nullable: true }
        field_confidences:
          { type: object, additionalProperties: true, nullable: true }
        validation_result:
          { type: object, additionalProperties: true, nullable: true }
        classified_at: { type: string, nullable: true }
        fme_date: { type: string, nullable: true }
        fme_folio_number: { type: string, nullable: true }
        fme_folio_date: { type: string, nullable: true }
        fme_folio_inscription_date: { type: string, nullable: true }
        item_value: { type: object, additionalProperties: true, nullable: true }
        item_status: { type: string }
        siger_folio_number: { type: string, nullable: true }
        siger_folio_date: { type: string, nullable: true }
        siger_folio_inscription_date: { type: string, nullable: true }
        is_duplicate_item: { type: boolean, nullable: true }
        notary_name: { type: string, nullable: true }
        notary_number: { type: string, nullable: true }
        folio_number: { type: string, nullable: true }
        folio_date: { type: string, nullable: true }
        folio_inscription_date: { type: string, nullable: true }
        notary_state: { type: string, nullable: true }
        notary_city: { type: string, nullable: true }
        assembly_minute:
          { type: object, additionalProperties: true, nullable: true }
        citations:
          type: object
          description: |
            Presente solo cuando se llamó con `?with_citations=true` y el ítem es de tipo acta. Contiene la URL firmada (CloudFront) al artifact de coordenadas en S3. Ver [Coordenadas de citas](/guia-devs/referencia/coordenadas-citas).
          properties:
            url:
              type: string
              format: uri
              description: |
                URL firmada y temporal. Descarga el JSON cuanto antes; si caduca, vuelve a llamar al endpoint con el flag para obtener una nueva. Si el artifact aún no se horneó para esta verificación, no se devuelve la llave citations.
              example: "https://files.gotrebol.com/{verification_id}/citations/sources/{item_id}.json?Expires=…&Signature=…"
          required:
            - url

    V2SourcesData:
      type: object
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/V2CompanySource" }

    V2PublicResponseCorporateHistory:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CorporateHistory" }
        meta: { $ref: "#/components/schemas/CorporateHistoryMeta" }

    CorporateHistoryMeta:
      type: object
      properties:
        section: { type: string, enum: [corporate-history] }
        verification:
          $ref: "#/components/schemas/V2VerificationMeta"

    CorporateHistory:
      type: object
      properties:
        schema_version:
          type: string
          description: Versión del contrato. Los campos nuevos son aditivos.
          example: "1.0"
        verification_id: { type: string }
        generated_at:
          type: string
          format: date-time
          description: Momento en que se calculó esta respuesta.
        coverage: { $ref: "#/components/schemas/CorporateHistoryCoverage" }
        contribution:
          { $ref: "#/components/schemas/CorporateHistoryContribution" }
        history:
          type: array
          description: Una fila por acta, de la más reciente a la más antigua por `timeline_date`.
          items: { $ref: "#/components/schemas/CorporateHistoryActa" }
        document_check:
          type: object
          properties:
            summary:
              $ref: "#/components/schemas/CorporateHistoryDocumentCheck"

    CorporateHistoryActa:
      type: object
      properties:
        acta_number:
          type: string
          nullable: true
          description: |
            Número del instrumento, normalizado a dígitos para poder cruzarse entre fuentes. Es `null` cuando no hay nada con qué identificarla: un documento subido sin número, una inscripción cuyo número no trae dígitos, o cualquier fila del listado sin números de instrumento (ver `coverage.siger.no_instrument_numbers`). Un acta sin número no se fusiona con ninguna otra, porque no hay llave.
          example: "4262"
        folios:
          type: array
          items: { type: string }
          description: |
            FME de cada folio que inscribió el acta, empezando por el orden en que los devolvió el registro; vacío cuando ningún folio la tiene. Es una lista porque un mismo instrumento puede inscribirse más de una vez: los folios que devuelve una consulta son la misma empresa vista desde varias oficinas registrales, y una sociedad que cambió de domicilio queda inscrita en el folio que dejó y en el que llegó. La identidad de un acta es `acta_number` solo, así que esas inscripciones son un acta y esta es la lista de dónde quedó.
          example: ["N-2022032489"]
        item_id:
          type: integer
          nullable: true
          description: ID del item de verificación que contiene el documento, cuando existe.
        alias_numbers:
          type: array
          items: { type: string }
          description: Otros números con que alguna fuente se refirió al mismo instrumento.
        acta_type:
          type: string
          nullable: true
          description: Tipo de item con que se cargó el documento (`ac_mx`, `aa_mx`, `pw_mx`). Es `null` para un acta que solo conocen el folio o los antecedentes.
        assembly_type:
          type: string
          nullable: true
          description: Texto literal de la fuente ("General", "acta constitutiva", "protocolización"). Sin catálogo normalizado.
        formalized_by:
          type: object
          description: El fedatario, copiado de la fuente que lo traiga. No se concilia entre fuentes; el mismo corredor aparece escrito de tres formas distintas en tres actas.
          properties:
            type: { type: string, nullable: true }
            name: { type: string, nullable: true }
            number: { type: string, nullable: true }
            city: { type: string, nullable: true }
        assembly_date:
          type: string
          format: date
          nullable: true
          description: Cuándo se reunió la asamblea.
        instrument_date:
          type: string
          format: date
          nullable: true
          description: Cuándo un fedatario protocolizó el acta.
        registration_date:
          type: string
          format: date
          nullable: true
          description: Cuándo el registro la inscribió.
        timeline_date:
          type: string
          format: date
          nullable: true
          description: Llave de orden, con precedencia `instrument_date` → `registration_date` → `assembly_date`. El historial está ordenado por cuándo se documentó un cambio, no por cuándo ocurrió.
        sources:
          type: array
          description: Qué fuentes conocen esta acta, en orden canónico.
          items: { type: string, enum: [siger, background, client_file] }
        proof_document:
          type: object
          nullable: true
          description: |
            La copia del documento que tenemos. `origin` importa: `client_upload` es evidencia de que el cliente lo tiene; `siger_extraction` significa que nosotros lo bajamos del folio, así que el archivo es real pero **no** cuenta como cobertura del expediente.
          properties:
            item_id: { type: integer }
            origin: { type: string, enum: [client_upload, siger_extraction] }
            url: { type: string }
        registry_entries:
          type: array
          description: Las inscripciones que el folio hizo para este instrumento. Un acta con dos inscripciones es una fila con dos entradas, no dos filas.
          items: { $ref: "#/components/schemas/CorporateHistoryRegistryEntry" }
        cites:
          type: array
          items: { type: string }
          description: Números de acta que los antecedentes de **esta** acta refieren.
        cited_by:
          type: array
          items: { type: string }
          description: Actas cuyos antecedentes refieren a esta. Es lo que sostiene un acta que nadie subió.
        changes:
          type: array
          items: { $ref: "#/components/schemas/CorporateHistoryChange" }
        evidence:
          type: array
          description: Citas textuales que respaldan lo que se afirma de esta acta.
          items: { $ref: "#/components/schemas/CorporateHistoryEvidence" }

    CorporateHistoryRegistryEntry:
      type: object
      properties:
        folio:
          type: string
          nullable: true
          description: FME del folio que hizo la inscripción. Null cuando la fuente no lo nombró.
        row:
          type: integer
          description: |
            Renglón del acto dentro del folio. `folio` y `row` juntos son su identidad: los renglones se numeran por folio, así que en un acta inscrita en más de uno, `row` sólo identifica una entrada leído junto con `folio`. Por eso las referencias de `changes[].reported_by.registry_entries` traen las dos llaves.
        page: { type: integer, nullable: true }
        nci: { type: string, nullable: true }
        label:
          type: string
          description: El acto tal como el registro lo nombró.
        form:
          type: string
          nullable: true
          description: Forma precodificada, código y etiqueta juntos.
          example: "M2 - Asamblea"
        mode: { type: string, nullable: true }
        admitted_at:
          type: string
          format: date
          nullable: true
          description: Fecha de ingreso a ventanilla.
        registered_at:
          type: string
          format: date
          nullable: true
          description: Fecha de inscripción.
        modifications:
          type: array
          description: |
            Las casillas que el folio marcó en verdadero, copiadas literalmente y **sin interpretar**. `type` es la redacción que el registro imprimió, no un nombre de campo: las etiquetas varían entre formas del mismo folio. Sirven para ver que un acto marca disolución aunque ninguna fuente la describa.
          items:
            type: object
            properties:
              type: { type: string }
              value: { type: boolean }
        proof_document_url: { type: string, nullable: true }

    CorporateHistoryChange:
      type: object
      properties:
        event_type:
          type: string
          description: |
            Código del evento. El folio y los antecedentes usan **vocabularios disjuntos** (`modificacion_capital` vs `aumento_capital`) y no se fusionan: unirlos exigiría una tabla de equivalencias que deliberadamente no existe. Por eso ningún cambio trae las dos fuentes, y la corroboración cruzada se ve a nivel de acta, en `sources`.
          example: modificacion_capital
        description: { type: string }
        sources:
          type: array
          items: { type: string, enum: [siger, background, client_file] }
        reported_by:
          type: object
          description: |
            Quién reportó el cambio. Nunca las dos listas a la vez: `registry_entries` solo la llena el folio y `citing_actas` solo los antecedentes, porque sus vocabularios de `event_type` son disjuntos y un cambio no se fusiona entre fuentes.
          properties:
            registry_entries:
              type: array
              description: |
                Las inscripciones del folio que reportaron el cambio. Cada referencia resuelve contra `registry_entries` del acta por **las dos** llaves: los renglones se numeran por folio, así que en un acta inscrita en más de uno el `row` solo no identifica una entrada.
              items:
                type: object
                properties:
                  folio:
                    type: string
                    nullable: true
                    description: FME del folio que hizo la inscripción. Null cuando la fuente no lo nombró.
                  row:
                    type: integer
                    description: Renglón de la inscripción dentro de ese folio.
              example:
                [
                  { folio: "N-2022032489", row: 2 },
                  { folio: "N-2022032489", row: 3 },
                ]
            citing_actas:
              type: array
              items: { type: string }
              description: Números de las actas cuyos antecedentes mencionan el cambio.
              example: ["103930"]

    CorporateHistoryEvidence:
      type: object
      properties:
        cited_in:
          type: string
          description: Número del acta que contiene la cita.
        cited_in_date:
          type: string
          format: date
          nullable: true
          description: Fecha del acta que cita, para poder ordenar dos versiones de un mismo hecho.
        page: { type: string, nullable: true }
        quote:
          type: string
          description: Texto literal de la fuente.

    CorporateHistoryCoverage:
      type: object
      description: Hasta dónde vemos. Nunca afirma que el historial esté completo.
      properties:
        siger:
          type: object
          properties:
            folios_queried:
              type: array
              items: { type: string }
              description: FME de cada folio leído, en el orden en que SIGER los devolvió.
            queried_at: { type: string, format: date-time, nullable: true }
            entries_returned:
              type: integer
              description: Inscripciones que los folios devolvieron en total, antes de descartar ninguna.
            folios_returned: { type: integer }
            no_instrument_numbers:
              type: boolean
              description: |
                Presente y en verdadero cuando el listado del folio se encontró pero sus documentos nunca se descargaron. Esas filas no traen número de instrumento, así que no se pueden agrupar ni cruzar con nada — pero sí se emiten: que no podamos cruzar una inscripción no es razón para ocultar que el registro la hizo.
            filing_items_returned:
              type: integer
              description: Filas del listado, presente solo en el caso anterior.
        background:
          type: object
          properties:
            extracted_from:
              type: array
              items: { type: string }
              description: Números de las actas cuyos antecedentes se leyeron. Un acta del expediente que no aparezca aquí es un acta cuyos antecedentes no se extrajeron.
            records_unidentified:
              type: integer
              description: Registros que no nombraron un número de instrumento usable, así que describen un acta que no se puede ubicar. Se cuentan en vez de emitirse.
            unreadable_extractions:
              type: array
              items: { type: string }
              description: Actas cuya extracción existía pero no arrojó ningún registro legible. Se reporta porque una extracción que corrió y no produjo nada es un hueco en la cobertura, y un resultado vacío es indistinguible de un acta que genuinamente no cita nada.
            numbers_corrected:
              type: array
              description: |
                Números de instrumento que la extracción convirtió mal, corregidos a partir de la transcripción literal que ella misma escribió junto a ellos.

                Los antecedentes suelen escribir el número en letra ("mil trescientos veintidós") y la extracción lo devuelve en dígitos y transcrito. Los dígitos se verifican contra una lectura determinística de las palabras, y cuando difieren gana la lectura.

                Se reporta en vez de aplicarse en silencio porque la corrección cambia **qué acta es** esa fila: con qué inscripción del folio se cruza y qué documento se cuenta como faltante. Vacío para extracciones anteriores a que el prompt pidiera la transcripción, donde no hay contra qué verificar.
              items:
                type: object
                properties:
                  cited_in:
                    type: string
                    description: Acta cuyos antecedentes lo traían.
                  literal:
                    type: string
                    description: El número tal como el documento lo imprime.
                  reported:
                    type: string
                    description: Lo que la extracción escribió.
                  corrected:
                    type: string
                    description: Lo que el literal realmente dice, y lo que el historial usa.
        combined:
          type: object
          properties:
            earliest_timeline_date:
              { type: string, format: date, nullable: true }
            latest_timeline_date: { type: string, format: date, nullable: true }
            no_acta_after:
              type: string
              format: date
              nullable: true
              description: |
                Fecha de asamblea del acta más reciente del expediente. Es un hecho sobre nuestros datos, no sobre la empresa: los antecedentes de un acta solo alcanzan hasta su propia asamblea, así que un cambio posterior a esta fecha no sería visible ni aunque hubiera ocurrido.

    CorporateHistoryContribution:
      type: object
      description: Qué aportó cada fuente. `only_in_*` es lo que se habría perdido sin ella.
      properties:
        total_actas: { type: integer }
        in_siger: { type: integer }
        in_background: { type: integer }
        in_client_file: { type: integer }
        only_in_siger: { type: integer }
        only_in_background: { type: integer }
        only_in_client_file: { type: integer }

    CorporateHistoryDocumentCheck:
      type: object
      description: |
        Conteo objetivo del expediente, sin lista paralela y sin ranking. La lista de faltantes se deriva del historial: `history.filter(a => !a.sources.includes("client_file"))`. El criterio es la pertenencia a `sources`, no la presencia de `proof_document`: un acta que el cliente subió pero cuyo archivo no se pudo resolver sigue siendo un acta que tiene.
      properties:
        actas_in_history: { type: integer }
        client_uploaded: { type: integer }
        not_uploaded_by_client: { type: integer }

    V2PublicResponseDetails:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/V2DetailsData" }
        meta: { $ref: "#/components/schemas/V2Meta" }

    V2PublicResponsePeople:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/V2PeopleData" }
        meta: { $ref: "#/components/schemas/V2Meta" }

    V2PublicResponseShareholders:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/V2ShareholdersData" }
        meta: { $ref: "#/components/schemas/V2Meta" }

    V2PublicResponseDocuments:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/V2DocumentsData" }
        meta: { $ref: "#/components/schemas/V2Meta" }

    V2PublicResponseSources:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/V2SourcesData" }
        meta: { $ref: "#/components/schemas/V2Meta" }

    V2ExternalLookupEvidence:
      type: object
      description: Artefacto de soporte de una consulta externa.
      properties:
        type:
          type: string
          description: Tipo de evidencia.
          enum: [screenshot, pdf, external_link, trebol_report]
        url:
          type: string
          description: >
            URL del artefacto. Para `screenshot` y `pdf` es una URL firmada de corta
            duración (~1 hora); para `external_link` es la URL pública de la dependencia.
        label:
          {
            type: string,
            nullable: true,
            description: "Descripción legible del artefacto.",
          }
        generated_at:
          type: string
          nullable: true
          description: "Fecha (ISO 8601) en que se produjo el artefacto, si se conoce."
        expires_at:
          type: string
          nullable: true
          description: "Fecha (ISO 8601) en que expira la URL firmada. null para enlaces externos o estáticos."

    V2ExternalLookup:
      type: object
      description: Registro de una consulta realizada a una fuente pública o gubernamental.
      properties:
        source:
          type: string
          description: Fuente consultada.
          enum: [sat, renapo, ine, siger]
        lookup_type:
          type: string
          description: Tipo de consulta realizada.
          enum:
            [
              signature_certificates,
              csf_qr_validation,
              curp,
              lista_nominal,
              commercial_registry,
            ]
        agency_name:
          {
            type: string,
            description: "Nombre completo de la dependencia consultada.",
          }
        subject_type:
          type: string
          description: Sobre quién se realizó la consulta.
          enum: [business, person]
        subject_name:
          {
            type: string,
            nullable: true,
            description: "Nombre del sujeto consultado.",
          }
        subject_identifier:
          type: string
          nullable: true
          description: "Identificador enviado a la dependencia: RFC, CURP, clave de elector o folio mercantil (FME)."
        queried_at:
          type: string
          nullable: true
          description: "Fecha y hora (ISO 8601) de la consulta. null cuando la fuente aún no expone una fecha confiable."
        status:
          type: string
          description: Resultado de la consulta.
          enum: [success, not_found, failed, pending, unknown]
        evidence:
          type: array
          description: "Artefactos de soporte de la consulta (capturas, PDFs o enlaces a la dependencia)."
          items: { $ref: "#/components/schemas/V2ExternalLookupEvidence" }
        data:
          type: object
          additionalProperties: true
          description: >
            Datos extraídos de la consulta, específicos de cada fuente y en snake_case.
            Ver el detalle por ítem en [Items de consultas públicas — KYB México](/guia-devs/uso-kyb/mexico/items-consultas-publicas).

    V2ExternalLookupsData:
      type: array
      description: Arreglo plano de registros de consultas externas, uno por consulta realizada.
      items: { $ref: "#/components/schemas/V2ExternalLookup" }

    V2PublicResponseExternalLookups:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/V2ExternalLookupsData" }
        meta: { $ref: "#/components/schemas/V2Meta" }

    FindingsRunConflict:
      type: object
      description: >
        Respuesta `409` de `POST /verifications/{verification-id}/findings/run`
        cuando la corrida de hallazgos no procede en el estado actual de la verificación.


        Este cuerpo usa `error_code`, no el `code` de `ErrorResponse`, a propósito: `code`
        clasifica el error de forma genérica (`VALIDATION_ERROR`, `NOT_FOUND`) y acompaña a
        `success: false`, mientras que `error_code` dice qué condición del negocio impide la
        corrida y se lee para decidir qué hacer a continuación. Ver STYLE_GUIDE, "No duplicar
        significado".
      properties:
        error_code:
          type: string
          enum:
            [not_enabled, pending_documents, already_scheduled, recently_run, up_to_date]
          description: >
            Causa por la que la corrida no procede. `not_enabled`: la cuenta no tiene
            habilitada la Síntesis de Dictamen. `pending_documents`: hay documentos
            requeridos sin subir o aún en procesamiento. `already_scheduled`: ya hay una
            corrida encolada o en ejecución. `recently_run`: hubo una corrida manual hace
            muy poco y aún corre el periodo mínimo entre corridas. `up_to_date`: nada
            cambió desde la última corrida — este endpoint **no** devuelve este código
            (las corridas bajo demanda no exigen que haya cambiado un documento); queda
            en el enum porque el mismo esquema describe las corridas automáticas.
        message:
          type: string
          description: Descripción legible de la causa, pensada para mostrarse tal cual.
        pending_items:
          type: array
          description: >
            Solo cuando `error_code` es `pending_documents`: los items de documento que
            bloquean la corrida (nombre configurado del item o, en su defecto, su tipo).
            Vacía cuando todavía no se sube ningún documento requerido.
          items:
            type: string
        retry_after_seconds:
          type: integer
          description: >
            Solo cuando `error_code` es `recently_run`: segundos que faltan para poder
            pedir otra corrida. Es el tiempo restante, no la duración total del
            periodo mínimo entre corridas.
          example: 240
      required:
        - error_code
        - message
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Descripción breve y accionable del error"
        code:
          oneOf:
            - type: string
              enum:
                [
                  VALIDATION_ERROR,
                  BAD_REQUEST,
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  DUPLICATE_RESOURCE,
                  INTERNAL_SERVER_ERROR,
                ]
            - type: string
              description: Código de dominio específico (p.ej., items_not_provided)
          example: VALIDATION_ERROR
        timestamp:
          type: string
          format: date-time
          example: "2025-01-01T12:34:56.000Z"
    PublicVerification:
      type: object
      properties:
        country: { type: string }
