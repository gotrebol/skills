    RequirementDefinition:
      type: object
      properties:
        ui_options:
          type: object
          properties:
            label:
              type: string
              description: Etiqueta que se mostrará en la interfaz de usuario
              example: "Constancia de Situación Fiscal"
            description:
              type: string
              description: Descripción detallada del requerimiento
              example: "Documento que certifica que la empresa está al día con sus obligaciones fiscales."
            conditional_render:
              type: boolean
              description: Indica si el campo debe ser renderizado condicionalmente mediante un checkbox, que tiene como leyenda la propiedad conditional_render_label.
            conditional_render_label:
              type: string
              description: Etiqueta que se mostrará en la interfaz de usuario para el campo condicional.
              example: "¿Los poderes del representante legal figuran en un acta de asamblea o poder notarial?"
        allowed_item_types:
          type: array
          description: Lista de tipos de items permitidos para este requerimiento
          items:
            $ref: "#/components/schemas/AllowedItemType"
          example: ["csf_mx"]
        validation_options:
          type: object
          properties:
            on_invalid_type_error:
              type: string
              description: |
                Determina el comportamiento cuando el documento no pasa la validación de tipo o de ruleset.
                - `"invalidate"` (default): el widget muestra al prospecto una alerta de error. El prospecto puede subir otro documento o continuar con el actual. El requerimiento se marca como `status: "error"`.
                - `"ignore"`: el widget muestra al prospecto el requerimiento como "en revisión" sin error. El operador del dashboard resuelve manualmente desde la webapp con 3 opciones: invalidar y pedir nuevo documento, descartar sin acción, o aceptar y elegir el tipo de ítem para extracción.
                Esta configuración aplica por igual a errores de tipo de documento y a fallos de reglas del `ruleset`. Los errores de sistema (`validation_request_failed`) siempre se tratan como error independientemente de este valor.
                Consulta la [guía de Flujos de onboarding](/guia-devs/account-flows#comportamiento-ante-error-de-validación-validation_optionson_invalid_type_error) para más detalles.
              enum:
                - "invalidate"
                - "ignore"
            ruleset:
              type: array
              description: |
                Lista de reglas de validación de negocio que se evaluarán automáticamente sobre el documento mediante IA.
                Consulta la guía de [flujo de validación de documentos](/guia-devs/flujo-validacion-documentos#reglas-de-validación-predefinidas-de-trébol) de documentos para la documentación completa de reglas predefinidas (`vr_trebol_*`) y personalizadas.
                **Nota:** el campo `error_message` es requerido para este caso en particular.
              items:
                type: object
                required:
                  - id
                  - error_message
                properties:
                  id:
                    type: string
                    description: Identificador de la regla. Para reglas predefinidas de Trébol usa el prefijo `vr_trebol_`. Para reglas personalizadas, cualquier identificador único.
                    example: "vr_trebol_antiguedad"
                  error_message:
                    type: string
                    description: Mensaje de error personalizado que se mostrará al usuario cuando la regla no se cumpla. Requerido al configurar el ruleset en un account flow.
                    example: "La CSF debe tener menos de 60 días de antigüedad"
                  validation_rule:
                    type: string
                    description: Texto completo de la pregunta de validación para reglas personalizadas. No incluir en reglas predefinidas de Trébol (`vr_trebol_*`).
                    example: "¿El RFC visible en el documento coincide con el RFC registrado de la empresa?"
                  params:
                    type: object
                    description: Parámetros para sustituir placeholders en reglas predefinidas de Trébol.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: number
                    example:
                      days: 60
        allowed_item_subtype:
          type: string
          description: El subtipo de item que se permite para este requerimiento, solo algunos items tienen subtipos, como los csf, o los bank statements.
          enum:
            - "business"
            - "individual"
          example: "business"
        required_options:
          type: object
          properties:
            people_scope:
              type: array
              items:
                type: string
                description: El alcance de las personas que deben ser consideradas en la verificación, aplica cuando el tipo de item es un person_id.
                enum:
                  - "powers"
      required:
        - ui_options
        - allowed_item_types
    RecordValidationSchema:
      type: object
      description: Schema de validación para el expediente de la verificacion. Las reglas que se definan aqui sera la que determine la finalizacion de la verificacion.
      properties:
        version:
          type: number
          description: Version del schema de validacion, ahora solo soporta la version 2.
          enum:
            - 2
        requirements:
          type: object
          description: Mapa de requerimientos donde la clave es un ID personalizado (por ejemplo, "doc_1")
          additionalProperties:
            $ref: "#/components/schemas/RequirementDefinition"
          example:
            doc_1:
              ui_options:
                label: "Constancia de Situación Fiscal"
                description: "Documento que certifica que la empresa está al día con sus obligaciones fiscales."
                conditional_render: true
                conditional_render_label: "¿Los poderes del representante legal figuran en un acta de asamblea o poder notarial?"
              allowed_item_types:
                - "csf_mx"
              validation_options:
                on_invalid_type_error: "invalidate"
        optional_requirements:
          type: object
          description: Mapa de requerimientos opcionales donde la clave es un ID personalizado (por ejemplo, "doc_1")
          additionalProperties:
            $ref: "#/components/schemas/RequirementDefinition"
    VerificationItemValidationSchema:
      type: object
      description: Schema de validación para items individuales
      properties:
        validationsMap:
          type: object
          description: Mapa de validaciones por tipo de item o validación específica
          additionalProperties:
            type: object
            properties:
              validationExpression:
                type: string
                description: Expresión que debe evaluarse como verdadera para que la validación pase
                example: "businessName && businessTaxId"
              trigger:
                type: string
                description: Evento que dispara la validación
                enum:
                  ["verification_item.classified", "verification_item.complete"]
              onValidationFailure:
                type: object
                description: Acciones a tomar cuando la validación falla
                properties:
                  actionType:
                    type: string
                    enum: ["invalidate", "warn"]
                    description: Tipo de acción a tomar
                  message:
                    type: string
                    description: Mensaje de error o advertencia
              onValidationSuccess:
                type: object
                description: Acciones a tomar cuando la validación es exitosa
                properties:
                  actionType:
                    type: string
                    enum: ["invalidate", "warn"]
                    description: Tipo de acción a tomar
                  message:
                    type: string
                    description: Mensaje de éxito
            required:
              - validationExpression
              - trigger
              - onValidationFailure
