    ExportWithKeyPeopleRequest:
      type: object
      required:
        - key_people
      properties:
        key_people:
          type: array
          description: Array de objetos que mapean variables de apoderados en la plantilla con personas y roles específicos.
          items:
            type: object
            required:
              - key
              - person_id
              - role_id
            properties:
              key:
                type: string
                description: Clave que identifica la variable en la plantilla. Debe coincidir con la nomenclatura {key_person_#} donde # es un número (ej: "key_person_1", "key_person_2").
                example: "key_person_1"
              person_id:
                type: number
                description: ID de la persona. Se obtiene del campo `people_id` en el array `key_people` del endpoint `/v2/verifications/{id}/people`.
                example: 10
              role_id:
                type: string
                description: ID del rol. Se obtiene del campo `id` en los roles dentro del array `key_people` del endpoint `/v2/verifications/{id}/people`.
                example: "role_123"
    CreateCustomItemTypeRequest:
      type: object
      required:
        - name
        - user_input
        - friendly_name
      properties:
        name:
          type: string
          description: "Clave del tipo de documento. Debe empezar con `cit_` y no puede contener espacios (ej. `cit_contrato_arrendamiento`). Única por cuenta."
          example: "cit_contrato_arrendamiento"
        user_input:
          type: string
          description: Instrucciones para identificar este tipo de documento.
          example: "Este documento es un contrato de arrendamiento inmobiliario firmado ante notario."
        friendly_name:
          type: string
          description: Nombre legible para interfaces. Entre 2 y 255 caracteres.
          example: "Contrato de arrendamiento"
        auto_improve:
          type: boolean
          default: true
          description: Cuando es `false`, Trébol no ejecuta mejora automática y conserva las instrucciones tal cual.
    UpdateCustomItemTypeRequest:
      type: object
      description: Debes enviar al menos un campo (`name`, `friendly_name` o `status`).
      properties:
        name:
          type: string
          description: Renombra el tipo. No puede contener espacios. Única por cuenta.
        friendly_name:
          type: string
          description: Actualiza el nombre legible. Entre 2 y 255 caracteres.
        status:
          type: string
          enum: ["active", "archived"]
          description: "`archived`: pausa el tipo, sigue en el listado y puede reactivarse. `active`: reactiva un tipo archivado."
    CustomItemTypeProcess:
      type: object
      properties:
        id:
          type: string
          description: Identificador único del proceso generado por Trébol.
          example: "ccp_def456"
        process_reference:
          type: string
          description: |
            Etiqueta del proceso asignada por el usuario. Identifica el resultado de este proceso en el ítem procesado: cada paso de `item_value.pipeline` lo trae en `process_reference`. Ver [Tipos de ítem personalizados](/producto/guias/tipos-de-item-personalizados#donde-salen-los-resultados).
          example: "extraer_montos"
        process_type:
          type: string
          enum: ["classification", "validation", "extraction"]
          description: Tipo de proceso.
        is_active:
          type: boolean
          description: Indica si el proceso está activo.
          example: true
        failure_policy:
          type: string
          nullable: true
          enum: ["warning", "hard_stop", null]
          description: "Política de fallo para validaciones. `warning`: el ítem se pausa hasta que se revise el resultado. `hard_stop`: si la regla no se cumple, el ítem se da por finalizado. `null`: el ítem continúa procesándose aunque la regla falle. Para clasificación y extracción siempre es `null`."
        active_version_id:
          type: integer
          nullable: true
          description: ID de la versión activa del proceso.
          example: 42
        version_number:
          type: integer
          description: Número secuencial de la versión activa.
          example: 1
        created_at:
          type: string
          format: date-time
          description: Fecha de creación del proceso.
        updated_at:
          type: string
          format: date-time
          description: Fecha de última actualización del proceso.
    CustomItemTypeProcessWithContent:
      allOf:
        - $ref: "#/components/schemas/CustomItemTypeProcess"
        - type: object
          properties:
            user_input:
              type: string
              description: Instrucciones escritas por el usuario para este proceso.
              example: "Este documento es un contrato de arrendamiento..."
            json_schema:
              type: object
              nullable: true
              description: Esquema JSON de salida para procesos de extracción. NULL para clasificación y validación.
    CustomItemTypeData:
      type: object
      properties:
        id:
          type: string
          description: Identificador único del tipo generado por Trébol.
          example: "cit_abc123"
        name:
          type: string
          description: Clave del tipo de documento (empieza con `cit_`).
          example: "cit_contrato_arrendamiento"
        friendly_name:
          type: string
          description: Nombre legible para interfaces.
          example: "Contrato de arrendamiento"
        status:
          type: string
          enum: ["active", "archived"]
          description: Estado del tipo.
          example: "active"
        created_at:
          type: string
          format: date-time
          description: Fecha de creación.
        updated_at:
          type: string
          format: date-time
          description: Fecha de última actualización.
        processes:
          type: array
          description: Procesos vinculados al tipo.
          items:
            $ref: "#/components/schemas/CustomItemTypeProcess"
    CustomItemTypeReadData:
      description: Tipo de ítem personalizado con procesos completos (incluye user_input y json_schema). Usado en respuestas GET.
      allOf:
        - $ref: "#/components/schemas/CustomItemTypeData"
        - type: object
          properties:
            processes:
              type: array
              description: Procesos vinculados al tipo con contenido completo (user_input, json_schema).
              items:
                $ref: "#/components/schemas/CustomItemTypeProcessWithContent"
    CustomItemTypeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/CustomItemTypeData"
    CustomItemTypeUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Tipo actualizado (sin procesos).
          properties:
            id:
              type: string
              example: "cit_abc123"
            name:
              type: string
              example: "cit_contrato_arrendamiento_v2"
            friendly_name:
              type: string
            status:
              type: string
              enum: ["active", "archived"]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    CustomItemTypeReadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/CustomItemTypeReadData"
    CustomItemTypeReadListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomItemTypeReadData"
        next:
          type: string
          nullable: true
          description: Token de cursor para la siguiente página. `null` o ausente si no hay más resultados.
    CustomItemTypeProcessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/CustomItemTypeProcess"
    CustomItemTypeProcessDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/CustomItemTypeProcessWithContent"
    CreateCustomItemTypeProcessRequest:
      type: object
      required:
        - process_type
        - process_reference
        - user_input
      properties:
        process_type:
          type: string
          enum: ["validation", "extraction"]
          description: "Tipo de proceso a crear. Hasta 5 procesos de extracción y 20 de validación por tipo."
        process_reference:
          type: string
          description: Etiqueta del proceso. Única dentro del mismo tipo.
          example: "extraer_montos"
        user_input:
          type: string
          description: Instrucciones escritas por el usuario para este proceso.
          example: "Extrae todos los montos monetarios del contrato."
        json_schema:
          type: object
          description: 'Solo para procesos de extracción. Define el esquema JSON de salida. Cuando se envía, `auto_improve` se establece en `false` automáticamente; enviar `auto_improve: true` junto con `json_schema` devuelve error 400. La raíz debe ser `type: object` con `properties`. Usa `type: ["<tipo>", "null"]` para campos anulables. Consulta la [estructura del json_schema](/producto/guias/tipos-de-item-personalizados#estructura-del-json_schema) para el formato requerido y ejemplos.'
        auto_improve:
          type: boolean
          default: true
          description: "Para extracción sin `json_schema`, debe enviarse como `true` (o se omite; por defecto `true`). Enviar `false` sin `json_schema` devuelve error 400. Cuando se envía `json_schema`, `auto_improve` se establece en `false` automáticamente; enviar `true` devuelve error 400. Para validación, es opcional (por defecto `true`)."
        failure_policy:
          type: string
          nullable: true
          enum: ["warning", "hard_stop", null]
          description: "Solo para validación. `warning`: el ítem se pausa hasta que se revise el resultado. `hard_stop`: si la regla no se cumple, el ítem se da por finalizado. `null`: el ítem continúa procesándose aunque la regla falle. Se rechaza si se envía en otro tipo de proceso."
    UpdateCustomItemTypeProcessRequest:
      type: object
      description: Debes enviar al menos un campo. `process_type` y `id` no se pueden cambiar.
      properties:
        process_reference:
          type: string
          description: Renombra la etiqueta. Única dentro del mismo tipo.
        is_active:
          type: boolean
          description: Activa o pausa el proceso sin eliminarlo. El proceso de clasificación no se puede pausar.
        user_input:
          type: string
          description: Nuevas instrucciones. Al cambiarlas se crea una nueva versión del proceso, que pasa a ser la activa.
        json_schema:
          type: object
          description: "Solo para procesos de extracción. Define el esquema JSON de salida. Enviarlo crea una nueva versión del proceso. Cuando se envía, `auto_improve` se establece en `false` automáticamente; enviar `auto_improve: true` junto con `json_schema` devuelve error 400. Enviarlo en un proceso que no es de extracción devuelve 400. Consulta la [estructura del json_schema](/producto/guias/tipos-de-item-personalizados#estructura-del-json_schema) para el formato requerido y ejemplos."
        auto_improve:
          type: boolean
          default: true
          description: "Solo aplica cuando `user_input` cambia. Si es `false`, las instrucciones mejoradas se rellenan con el `user_input` tal cual. Cuando se envía `json_schema`, `auto_improve` se establece en `false` automáticamente; enviar `true` devuelve error 400."
        failure_policy:
          type: string
          nullable: true
          enum: ["warning", "hard_stop", null]
          description: "Solo para validación. `warning`: el ítem se pausa hasta que se revise el resultado. `hard_stop`: si la regla no se cumple, el ítem se da por finalizado. `null`: el ítem continúa procesándose aunque la regla falle."
