        fiscal: { $ref: "#/components/schemas/FiscalMatch" }
        address: { $ref: "#/components/schemas/AddressMatch" }
        ubo_forms: { type: object, additionalProperties: true, nullable: true }
        external_identities:
          {
            $ref: "#/components/schemas/PublicExternalIdentities",
            nullable: true,
          }
