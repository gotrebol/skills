  /whitelist-ips:
    get:
      tags:
        - Gestión de IPs Permitidas
      summary: Obtener lista de IPs permitidas para hacer llamadas a la API
      description: |
        Obtiene la lista de IPs permitidas para la cuenta del cliente. Si no hay IPs configuradas, 
        no se realiza validación de origen de las llamadas a la API. Si hay al menos una IP configurada, 
        todas las llamadas a la API deben provenir de estas IPs.
      responses:
        "200":
          description: Lista de IPs permitidas recuperada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ips:
                    type: array
                    description: Lista de direcciones IP permitidas (IPv4 e IPv6).
                    items:
                      type: string
                      pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$|^(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,7}:$|^(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,5}(?::[0-9a-fA-F]{1,4}){1,2}$|^(?:[0-9a-fA-F]{1,4}:){1,4}(?::[0-9a-fA-F]{1,4}){1,3}$|^(?:[0-9a-fA-F]{1,4}:){1,3}(?::[0-9a-fA-F]{1,4}){1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,2}(?::[0-9a-fA-F]{1,4}){1,5}$|^[0-9a-fA-F]{1,4}:(?:(?::[0-9a-fA-F]{1,4}){1,6})$|^:(?:(?::[0-9a-fA-F]{1,4}){1,7}|:)$'
                    example: ["192.168.1.1", "10.0.0.0/24", "2001:db8::1"]
                  count:
                    type: integer
                    description: Número total de IPs permitidas.
                    example: 3
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - ApiKeyAuth: []

    post:
      tags:
        - Gestión de IPs Permitidas
      summary: Agregar IPs a la lista de permitidas para hacer llamadas a la API
      description: |
        Agrega una o más direcciones IP a la lista de IPs permitidas. Si es la primera IP que se agrega, 
        automáticamente se activa la validación de origen para todas las llamadas a la API.
        Máximo 100 IPs permitidas por cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ips
              properties:
                ips:
                  type: array
                  description: Lista de direcciones IP a agregar (IPv4 e IPv6).
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$|^(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,7}:$|^(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,5}(?::[0-9a-fA-F]{1,4}){1,2}$|^(?:[0-9a-fA-F]{1,4}:){1,4}(?::[0-9a-fA-F]{1,4}){1,3}$|^(?:[0-9a-fA-F]{1,4}:){1,3}(?::[0-9a-fA-F]{1,4}){1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,2}(?::[0-9a-fA-F]{1,4}){1,5}$|^[0-9a-fA-F]{1,4}:(?:(?::[0-9a-fA-F]{1,4}){1,6})$|^:(?:(?::[0-9a-fA-F]{1,4}){1,7}|:)$'
            examples:
              SingleIP:
                summary: Agregar una sola IP
                value:
                  ips: ["192.168.1.1"]
              MultipleIPs:
                summary: Agregar múltiples IPs
                value:
                  ips: ["192.168.1.1", "10.0.0.0/24", "2001:db8::1"]
      responses:
        "200":
          description: IPs added successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "IPs added successfully"
                  added_ips:
                    type: array
                    description: Lista de IPs que fueron agregadas.
                    items:
                      type: string
                    example: ["192.168.1.1", "10.0.0.0/24"]
                  total_ips:
                    type: integer
                    description: Número total de IPs permitidas después de la operación.
                    example: 5
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "413":
          description: Maximum number of IPs (100) would be exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                IpsLimitExceeded:
                  summary: Límite de IPs excedido
                  value:
                    success: false
                    message: "Maximum number of IPs (100) would be exceeded"
                    current_count: 100
                    max_allowed: 100
                    request_count: 101
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - ApiKeyAuth: []

    delete:
      tags:
        - Gestión de IPs Permitidas
      summary: Eliminar todas las IPs permitidas
      description: |
        Elimina todas las IPs de la lista de permitidas. Después de esta operación, 
        no se realizará validación de origen para las llamadas a la API.
      responses:
        "200":
          description: All IPs have been deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "All IPs have been deleted"
                  deleted_count:
                    type: integer
                    description: Número de IPs que fueron eliminadas.
                    example: 5
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - ApiKeyAuth: []

  /whitelist-ips/{ip}:
    delete:
      tags:
        - Gestión de IPs Permitidas
      summary: Eliminar IP específica de la lista de permitidas
      description: |
        Elimina una dirección IP específica de la lista de IPs permitidas. 
        Si se elimina la última IP, se desactiva la validación de origen.
      parameters:
        - name: ip
          in: path
          required: true
          description: |
            Dirección IP a eliminar (IPv4 o IPv6).
            Para eliminar una IP con formato CIDR, es necesario codificar el `/` como `%2F`. Por ejemplo, para eliminar la IP `10.0.0.0/24`, la URL deberia ser `/whitelist-ips/10.0.0.0%2F24`.
          schema:
            type: string
            pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$|^(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,7}:$|^(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,5}(?::[0-9a-fA-F]{1,4}){1,2}$|^(?:[0-9a-fA-F]{1,4}:){1,4}(?::[0-9a-fA-F]{1,4}){1,3}$|^(?:[0-9a-fA-F]{1,4}:){1,3}(?::[0-9a-fA-F]{1,4}){1,4}$|^(?:[0-9a-fA-F]{1,4}:){1,2}(?::[0-9a-fA-F]{1,4}){1,5}$|^[0-9a-fA-F]{1,4}:(?:(?::[0-9a-fA-F]{1,4}){1,6})$|^:(?:(?::[0-9a-fA-F]{1,4}){1,7}|:)$'
            example: "192.168.1.1"
      responses:
        "200":
          description: IP eliminada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "IP eliminada exitosamente"
                  deleted_ip:
                    type: string
                    description: IP que fue eliminada.
                    example: "192.168.1.1"
                  remaining_ips:
                    type: integer
                    description: Número de IPs restantes en la lista.
                    example: 4
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - ApiKeyAuth: []

  /api-keys:
    get:
      tags:
        - Gestión de API Keys
      summary: Listar API keys
      description: |
        Obtiene la lista del id y la fecha de creación de todas las API keys asociadas a la cuenta del usuario.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Lista de API keys obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    description: Lista de API keys de la cuenta
                    items:
                      $ref: "#/components/schemas/ApiKeyInfo"
              examples:
                Success:
                  summary: Respuesta exitosa
                  value:
                    api_keys:
                      - id: "ak_1234567890abcdef"
                        created_at: "2024-01-15T10:30:00Z"
                      - id: "ak_0987654321fedcba"
                        created_at: "2024-01-10T14:20:00Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Gestión de API Keys
      summary: Crear nueva API key
      description: |
        Crea una nueva API key para la cuenta del usuario.
        La API key se genera automáticamente y se retorna una sola vez.
      security:
        - ApiKeyAuth: []
      requestBody:
        description: Datos para crear la nueva API key
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: Identificador único para la API key
                  example: "my-api-key-1"
            examples:
              CreateApiKey:
                summary: Crear nueva API key
                value:
                  id: "my-api-key-1"
      responses:
        "201":
          description: API key creada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID único de la API key
                    example: "ak_1234567890abcdef"
                  api_key:
                    type: string
                    description: La API key generada (solo se muestra una vez)
                    example: "treb_sk_live_1234567890abcdef1234567890abcdef1234567890abcdef"
                  created_at:
                    type: string
                    format: date-time
                    description: Fecha y hora de creación
                    example: "2024-01-15T10:30:00Z"
              examples:
                Success:
                  summary: API key creada
                  value:
                    id: "ak_1234567890abcdef"
                    api_key: "treb_sk_live_1234567890abcdef1234567890abcdef1234567890abcdef"
                    created_at: "2024-01-15T10:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api-keys/{apiKeyId}:
    delete:
      tags:
        - Gestión de API Keys
      summary: Eliminar API key
      description: |
        Elimina una API key específica de la cuenta del usuario.
        La eliminación es inmediata y no se puede deshacer.
        Se puede autenticar con cualquier API key válida de la cuenta.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          description: ID de la API key a eliminar
          schema:
            type: string
            example: "ak_1234567890abcdef"
      responses:
        "200":
          description: API key eliminada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "API key eliminada exitosamente"
              examples:
                Success:
                  summary: API key eliminada
                  value:
                    message: "API key eliminada exitosamente"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v2/retention-policy:
    get:
      tags:
        - Gestión de Política de Retención
      summary: Obtener política de retención actual
      description: |
        Obtiene la política de retención de datos configurada para la cuenta.
        Si no hay política configurada, retorna la política por defecto.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Política de retención obtenida exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicy"
              example:
                retention_days: 30
        "401":
          description: No autorizado. API key inválida o faltante.
        "500":
          description: Error interno del servidor.

    post:
      tags:
        - Gestión de Política de Retención
      summary: Crear política de retención
      description: |
        Crea una nueva política de retención de datos para la cuenta.
        Si ya existe una política, retorna un error.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPolicyRequest"
            example:
              retention_days: 30
      responses:
        "201":
          description: Política de retención creada exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicy"
              example:
                retention_days: 30
        "400":
          description: |
            Solicitud inválida. Posibles causas:
            - retention_days fuera del rango permitido (1-3650)
            - Ya existe una política de retención
        "401":
          description: No autorizado. API key inválida o faltante.
        "500":
          description: Error interno del servidor.

    put:
      tags:
        - Gestión de Política de Retención
      summary: Actualizar política de retención
      description: |
        Actualiza la política de retención de datos existente para la cuenta.
        Si no existe una política, la crea.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPolicyRequest"
            example:
              retention_days: 60
      responses:
        "200":
          description: Política de retención actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicy"
              example:
                retention_days: 60
        "400":
          description: |
            Solicitud inválida. Posibles causas:
            - retention_days fuera del rango permitido (1-3650)
        "401":
          description: No autorizado. API key inválida o faltante.
        "500":
          description: Error interno del servidor.

    delete:
      tags:
        - Gestión de Política de Retención
      summary: Eliminar política de retención
      description: |
        Elimina la política de retención de datos de la cuenta.
        Después de esta operación, se aplicará la política por defecto del sistema.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Política de retención eliminada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Política de retención eliminada exitosamente"
        "401":
          description: No autorizado. API key inválida o faltante.
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          description: Error interno del servidor.

  /v2/webhooks:
    get:
      tags:
        - Gestión de Webhooks
      summary: Listar webhooks
      description: |
        Obtiene la lista de webhooks configurados para tu cuenta. Cada webhook define una URL de destino,
        eventos suscritos y metadatos para la firma de seguridad.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Lista de webhooks obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookGet"
              examples:
                Success:
                  summary: Respuesta exitosa
                  value:
                    - id: "wh_123"
                      url: "https://example.com/webhooks/trebol"
                      events: ["verification.v2.created"]
                      status: "enabled"
                      description: "Webhook principal de producción"
                      created_at: "2025-08-20T10:00:00Z"
                      updated_at: "2025-08-20T10:00:00Z"
        "401":
          description: No autorizado - API key inválida.
        "500":
          description: Error interno del servidor.
    post:
      tags:
        - Gestión de Webhooks
      summary: Crear webhook
      description: |
        Crea un nuevo webhook para tu cuenta. Por seguridad, el secreto solo se muestra una vez en la creación.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreate"
            examples:
              CreateWebhook:
                summary: Crear webhook con eventos por defecto
                value:
                  url: "https://example.com/webhooks/trebol"
                  events:
                    ["verification.v2.created", "verification.v2.finished"]
                  description: "Webhook principal de producción"
      responses:
        "201":
          description: Webhook creado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
              examples:
                Success:
                  summary: Webhook creado
                  value:
                    id: "wh_123"
                    url: "https://example.com/webhooks/trebol"
                    events:
                      ["verification.v2.created", "verification.v2.finished"]
                    status: "enabled"
                    description: "Webhook principal de producción"
                    secret: "whsec_XXXXXXXXXXXXXXXXXXXXXXXX"
                    created_at: "2025-08-20T10:00:00Z"
                    updated_at: "2025-08-20T10:00:00Z"
        "400":
          description: Datos de entrada inválidos.
        "401":
          description: No autorizado - API key inválida.
        "500":
          description: Error interno del servidor.

  /v2/webhooks/{webhookId}:
    get:
      tags:
        - Gestión de Webhooks
      summary: Obtener webhook
      description: Obtiene la configuración de un webhook específico.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/webhookIdParam"
      responses:
        "200":
          description: Webhook obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookGet"
              examples:
                Success:
                  value:
                    id: "wh_123"
                    url: "https://example.com/webhooks/trebol"
                    events: ["verification.v2.created"]
                    status: "enabled"
                    description: "Webhook principal de producción"
                    created_at: "2025-08-20T10:00:00Z"
                    updated_at: "2025-08-20T10:00:00Z"
        "401":
          description: No autorizado
        "404":
          description: Webhook no encontrado
    put:
      tags:
        - Gestión de Webhooks
      summary: Actualizar webhook
      description: Actualiza la URL, eventos, descripción o estado activo del webhook.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/webhookIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdate"
            examples:
              UpdateWebhook:
                value:
                  url: "https://example.com/webhooks/trebol-v2"
                  events:
                    ["verification.v2.created", "verification.v2.finished"]
                  active: true
      responses:
        "200":
          description: Webhook actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookGet"
        "400":
          description: Datos de entrada inválidos
        "401":
          description: No autorizado
        "404":
          description: Webhook no encontrado
    delete:
      tags:
        - Gestión de Webhooks
      summary: Eliminar webhook
      description: Elimina un webhook específico.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/webhookIdParam"
      responses:
        "200":
          description: Webhook eliminado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Webhook eliminado exitosamente"
        "401":
          description: No autorizado
        "404":
          description: Webhook no encontrado

  /v2/custom-item-types:
    post:
      operationId: crearTipoItemPersonalizado
      tags:
        - Tipos de Ítem Personalizados
      summary: Crear un tipo de ítem personalizado
      description: |
        Crea un nuevo tipo de ítem personalizado. El `name` debe empezar con `cit_` y no puede contener espacios.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomItemTypeRequest"
            examples:
              WithAutoImprove:
                summary: Con mejora automática (por defecto)
                value:
                  name: "cit_contrato_arrendamiento"
                  user_input: "Este documento es un contrato de arrendamiento inmobiliario firmado ante notario."
                  friendly_name: "Contrato de arrendamiento"
              WithoutAutoImprove:
                summary: Sin mejora automática
                value:
                  name: "cit_certificado_estudios"
                  user_input: "Clasifica este documento como certificado de estudios solo si corresponde a un certificado emitido por una institución educativa."
                  friendly_name: "Certificado de estudios"
                  auto_improve: false
      responses:
        "201":
          description: Tipo de ítem personalizado creado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomItemTypeResponse"
        "400":
          description: |
            Solicitud inválida. Posibles causas:
            - `name`, `user_input` o `friendly_name` faltante o inválido.
            - `name` no empieza con `cit_` o contiene espacios.
            - `friendly_name` fuera del rango de 2 a 255 caracteres.
        "401":
          description: No autorizado. API key inválida o faltante.
        "409":
          description: "Conflicto: `name` ya existe en la cuenta (entre tipos activos y archivados)."
    get:
      operationId: listarTiposItemPersonalizados
      tags:
        - Tipos de Ítem Personalizados
      summary: Listar tipos de ítem personalizados
      description: |
        Devuelve los tipos no eliminados de la cuenta (activos y archivados) con sus procesos.
        Ordenados por fecha de creación descendente. Tamaño de página fijo: 10.
        Las respuestas GET incluyen `user_input` y `json_schema` en cada proceso.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: next
          in: query
          schema:
            type: string
          description: Token de cursor para obtener la siguiente página.
      responses:
        "200":
          description: Lista de tipos de ítem personalizados obtenida exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomItemTypeReadListResponse"
        "400":
          description: Token de cursor inválido.
        "401":
          description: No autorizado. API key inválida o faltante.

  /v2/custom-item-types/{id}:
    get:
      operationId: obtenerTipoItemPersonalizado
      tags:
        - Tipos de Ítem Personalizados
      summary: Obtener un tipo de ítem personalizado
      description: |
        Devuelve un tipo con todos sus procesos. Misma estructura que un elemento individual del listado.
        Los tipos archivados se devuelven normalmente; solo los eliminados (DELETE) producen 404.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/customItemTypeId"
      responses:
        "200":
          description: Tipo de ítem personalizado obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomItemTypeReadResponse"
        "401":
          description: No autorizado. API key inválida o faltante.
        "404":
          description: Tipo no encontrado o eliminado.
    patch:
      operationId: actualizarTipoItemPersonalizado
      tags:
        - Tipos de Ítem Personalizados
      summary: Actualizar un tipo de ítem personalizado
      description: |
        Actualiza campos del tipo. Debes enviar al menos un campo.
        Si todos los campos ya coinciden con los valores actuales, no se ejecuta ningún UPDATE y `updated_at` no cambia (idempotencia).
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/customItemTypeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomItemTypeRequest"
      responses:
        "200":
          description: Tipo actualizado exitosamente. Devuelve solo campos del tipo, sin procesos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomItemTypeUpdateResponse"
        "400":
          description: |
            Solicitud inválida. Posibles causas:
            - Ningún campo proporcionado, valor inválido o `name` vacío.
            - `status` con valor no permitido (solo `"active"` o `"archived"`).
            - `friendly_name` fuera del rango de 2 a 255 caracteres.
        "401":
          description: No autorizado. API key inválida o faltante.
        "404":
          description: Tipo no encontrado (los tipos archivados sí se pueden actualizar).
        "409":
          description: "`name` colisiona con otro tipo activo o archivado de la cuenta."
    delete:
      operationId: eliminarTipoItemPersonalizado
      tags:
        - Tipos de Ítem Personalizados
      summary: Eliminar un tipo de ítem personalizado
      description: |
        Elimina el tipo de forma permanente junto con todos sus procesos. Es irreversible.
        Para pausar un tipo sin borrarlo (y poder reactivarlo después), usa PATCH con `status: "archived"` en lugar de DELETE.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/customItemTypeId"
      responses:
        "200":
          description: Tipo eliminado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "cit_abc123"
        "401":
          description: No autorizado. API key inválida o faltante.
        "404":
          description: Tipo no encontrado o ya eliminado.

  /v2/custom-item-types/{id}/processes:
    post:
      operationId: crearProcesoTipoItemPersonalizado
      tags:
        - Tipos de Ítem Personalizados
      summary: Agregar un proceso a un tipo de ítem personalizado
      description: |
        Agrega un proceso de validación o extracción a un tipo existente. Hasta 5 procesos de extracción y 20 de validación por tipo.
        En procesos de extracción sin `json_schema`, `auto_improve` debe enviarse como `true`; enviarlo como `false` devuelve 400.
        Si se envía `json_schema`, `auto_improve` se establece en `false` automáticamente; enviarlo como `true` devuelve 400.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/customItemTypeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomItemTypeProcessRequest"
            examples:
              Extraction:
                summary: Proceso de extracción con auto_improve
                value:
                  process_type: "extraction"
                  process_reference: "extraer_montos"
                  user_input: "Extrae todos los montos monetarios del contrato, incluyendo renta mensual y depósito."
                  auto_improve: true
              ExtractionWithSchema:
                summary: Proceso de extracción con json_schema propio
                value:
                  process_type: "extraction"
                  process_reference: "extraer_personas"
                  user_input: "Extrae todas las personas mencionadas en el documento con su nombre completo y rol."
                  json_schema:
                    type: "object"
                    required:
                      - "persons"
                    properties:
                      persons:
                        type: "array"
                        description: "Lista de todas las personas mencionadas en el documento."
                        items:
                          type: "object"
                          required:
                            - "name"
                            - "role"
                          properties:
                            name:
                              type: "string"
                              description: "Nombre completo de la persona mencionada en el documento."
                            role:
                              type: ["string", "null"]
                              description: "Rol, cargo o calidad con la que la persona aparece en el documento. Usa null si no se especifica."
              Validation:
                summary: Proceso de validación con failure_policy
                value:
                  process_type: "validation"
                  process_reference: "validar_firmas"
                  user_input: "Verifica que el contrato contenga las firmas de ambas partes y del notario público."
                  failure_policy: "hard_stop"
      responses:
        "201":
          description: Proceso creado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomItemTypeProcessResponse"
        "400":
          description: |
            Solicitud inválida. Posibles causas:
            - Campos requeridos faltantes o inválidos.
            - `auto_improve: false` en extracción sin `json_schema`.
            - `auto_improve: true` en extracción con `json_schema`.
            - `json_schema` enviado en un proceso que no es de extracción.
            - `json_schema` con formato inválido.
            - `failure_policy` enviado en un proceso que no es de validación.
        "401":
          description: No autorizado. API key inválida o faltante.
        "404":
          description: Tipo padre no encontrado o eliminado.
        "409":
          description: |
            Conflicto. Posibles causas:
            - `process_reference` ya existe en este tipo.
            - `user_input` idéntico ya en uso en otro proceso del mismo tipo.
            - Se alcanzó el límite de procesos del tipo (5 de extracción o 20 de validación).

  /v2/custom-item-types/{id}/processes/{processId}:
    get:
      operationId: obtenerProcesoTipoItemPersonalizado
      tags:
        - Tipos de Ítem Personalizados
      summary: Obtener un proceso de un tipo de ítem personalizado
      description: |
        Devuelve un proceso con su versión activa, incluyendo `user_input` y `json_schema`.
        Para que el GET responda correctamente: el tipo padre debe existir (no eliminado ni archivado),
        el proceso debe existir (no eliminado), y la versión activa debe tener `user_input` no nulo.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/customItemTypeId"
        - $ref: "#/components/parameters/processId"
      responses:
        "200":
          description: Proceso obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomItemTypeProcessDetailResponse"
        "401":
          description: No autorizado. API key inválida o faltante.
        "404":
          description: Tipo padre no encontrado, proceso no encontrado, o versión activa inválida.
    patch:
      operationId: actualizarProcesoTipoItemPersonalizado
      tags:
        - Tipos de Ítem Personalizados
      summary: Actualizar un proceso de un tipo de ítem personalizado
      description: |
        Actualiza un proceso. Debes enviar al menos un campo. `process_type` y `id` no se pueden cambiar.
        Cuando el PATCH modifica `user_input`, se crea una nueva versión del proceso que pasa a ser la activa.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/customItemTypeId"
        - $ref: "#/components/parameters/processId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomItemTypeProcessRequest"
            examples:
              RotateUserInput:
                summary: Rotar user_input con mejora automática
                value:
                  user_input: "Extrae todos los montos monetarios del contrato: renta mensual, depósito, penalización por mora y total anual."
                  auto_improve: true
              DeactivateProcess:
                summary: Desactivar un proceso
                value:
                  is_active: false
      responses:
        "200":
          description: Proceso actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomItemTypeProcessResponse"
        "400":
          description: |
            Solicitud inválida. Posibles causas:
            - `failure_policy` con valor no nulo en un proceso que no es de validación.
            - `json_schema` enviado en un proceso que no es de extracción, o con formato inválido.
            - `auto_improve: true` enviado junto con `json_schema`.
        "401":
          description: No autorizado. API key inválida o faltante.
        "404":
          description: Tipo padre o proceso no encontrado.
        "409":
          description: |
            Conflicto. Posibles causas:
            - `process_reference` colisiona con otro proceso del mismo tipo.
            - `user_input` idéntico ya usado en otro proceso del mismo tipo.
            - Se intentó pausar (`is_active: false`) el proceso de clasificación, que no se puede pausar.
    delete:
      operationId: eliminarProcesoTipoItemPersonalizado
      tags:
        - Tipos de Ítem Personalizados
      summary: Eliminar un proceso de un tipo de ítem personalizado
      description: |
        Elimina permanentemente un proceso de validación o extracción. El proceso de clasificación no se puede eliminar; intentarlo devuelve 409. Para modificar sus instrucciones, usa PATCH sobre el proceso.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/customItemTypeId"
        - $ref: "#/components/parameters/processId"
      responses:
        "200":
          description: Proceso eliminado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "ccp_ghi789"
        "401":
          description: No autorizado. API key inválida o faltante.
        "404":
          description: Tipo padre no encontrado, o proceso no encontrado / ya eliminado.
        "409":
          description: No se puede eliminar el proceso de clasificación.

