components:
  parameters:
    etiquetaParam:
      name: etiqueta
      in: path
      required: true
      description: La etiqueta única que identifica la empresa dentro de tu sistema interno
      schema:
        type: string
    verificationIdParam:
      name: verification-id
      in: path
      required: true
      description: El ID único de la verificación
      schema:
        type: string
    webhookIdParam:
      name: webhookId
      in: path
      required: true
      description: ID único del webhook
      example: "wh_123"
      schema:
        type: string
    customItemTypeId:
      name: id
      in: path
      required: true
      description: Identificador único del tipo de ítem personalizado (ej. `cit_abc123`).
      schema:
        type: string
      example: "cit_abc123"
    processId:
      name: processId
      in: path
      required: true
      description: Identificador único del proceso (ej. `ccp_def456`).
      schema:
        type: string
      example: "ccp_def456"
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    BadRequestError:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            ValidationError:
              summary: Error de validación
              value:
                success: false
                message: "Validation failed: 'items' is required"
                code: VALIDATION_ERROR
                timestamp: "2025-01-01T12:34:56.000Z"
            ItemsNotProvided:
              summary: items_not_provided
              value:
                success: false
                message: "Please provide a valid items array or a flow id in your request"
                code: items_not_provided
                timestamp: "2025-01-01T12:34:56.000Z"
            InvalidItemType:
              summary: invalid_item_type
              value:
                success: false
                message: "The generic item type is not supported"
                code: invalid_item_type
                timestamp: "2025-01-01T12:34:56.000Z"
            InvalidItemOptionsFileUrl:
              summary: invalid_item_options_file_url
