        id_number: { type: string, nullable: true }
        id_number_rfc: { type: string, nullable: true }
        id_type:
          type: string
          nullable: true
          description: Tipo de identificación utilizado. Los valores posibles son "rfc" o "curp" si hubo coincidencia, de lo contrario null.
          enum: ["rfc", "curp", null]
        type:
          type: string
          nullable: true
          description: Tipo de entidad. Los valores posibles son "person" o "business".
