  /verifications/{verification-id}/add-items:
    put:
      tags:
        - Agregar items a una verificacion
      summary: Agregar items a una verificación existente
      description: |
        Agrega nuevos items/documentos a una verificación específica usando el id de la verificación.

        **Flujo de trabajo:**
        - **Paso 2 (Validación)**: Agregar items tipo `doc_validation` para validar documentos
        - **Paso 5 (Extracción)**: Agregar items de extracción real (`ac_mx`, `csf_mx`, etc.) basados en resultados de validación
      parameters:
        - in: path
          name: verification-id
          required: true
          description: El ID de la verificación.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  description: |
                    Una lista de ítems o documentos que serán agregados a la verificación, cada item debe tener un tipo y opciones.
                  items:
                    type: object
                    required:
                      - type
                      - options
                    properties:
                      type:
                        type: string
                        description: |
                          El tipo de documento o ítem a procesar. Acepta cualquier tipo soportado por Trébol.
                          - **Clasificación**: `generic` (Trébol detecta el tipo automáticamente).
                          - **Validación**: `doc_validation` (requiere `options.client_item_type`).
                          - **División de PDFs multi-documento**: `doc_splitter` (ver [guía del divisor de documentos](/producto/guias/doc-splitter)).
                          - **Extractores built-in México**: `ac_mx` (acta constitutiva), `aa_mx` (acta de asamblea), `pw_mx` (poder), `fme_mx` (fusión/escisión), `csf_mx` (constancia SAT), `union_documents_extractor`, entre otros.
                          - **Tipos personalizados**: nombres con prefijo `cit_` definidos en [tipos de ítem personalizados](/producto/guias/tipos-de-item-personalizados).

                          La lista completa vive en `SUPPORTED_ITEM_TYPES` del backend y crece con nuevos extractores; para ver la forma de respuesta por cada tipo consulta [respuestas por tipo de item](/guia-devs/referencia/respuestas-por-tipo-de-item).
                        example: "doc_validation"
                      tags:
                        type: object
                        description: Mapa de etiquetas que se asignarán al ítem como pares clave-valor.
                        additionalProperties:
                          type: string
                        example:
                          client_id: "some-client-id"
                      options:
                        type: object
                        description: |
                          Opciones adicionales para el ítem. Para el origen del archivo envía **uno** de:
                          `file_url` (URL descargable) o `file_source: "item"` (para referenciar un corte de un `doc_splitter`).
                          Si omites ambos, Trébol devuelve una `upload_url` presignada (ver [flujo de carga directa](/guia-devs/crear-verificaciones/via-api/carga-directa)). Este flujo también aplica a `doc_splitter`: sube el archivo y confirma con `options.uploaded_file: true`.
                        properties:
                          file_url:
                            type: string
                            description: URL de un archivo presignado que se puede descargar para el ítem a verificar.
                            example: "https://www.googleapis.com/downloadableFile"
                          constancia_type:
                            type: string
                            description: Tipo de constancia para items csf_mx (opcional). Especifica si es para empresa o individuo.
                            enum: ["business", "individual"]
                            example: "business"
                          people_scope:
                            type: array
                            description: Especifica el alcance de las personas que deben ser consideradas en la verificación.
                            items:
                              type: string
                              example: "powers"
                          client_item_type:
                            $ref: "#/components/schemas/ClientItemType"
                          allowed_item_types:
                            type: array
                            description: |
                              Solo para `doc_splitter`. Restringe los tipos que el splitter puede identificar. Acepta tipos built-in (por ejemplo `ac_mx`, `aa_mx`) y nombres de tipos de ítem personalizados (`cit_...`). Si se omite o está vacío, se usa el catálogo base completo.
                              **No confundir con** el `allowed_item_types` del `RequirementDefinition` (schema `AllowedItemType`): aquel es un enum cerrado usado en `record_validation_schema` para definir qué tipos satisfacen un requerimiento del expediente.
                            items:
                              type: string
                            example: ["ac_mx", "aa_mx"]
                          file_source:
                            type: string
                            description: |
                              Origen del archivo. Envía `"item"` para referenciar un corte generado por un ítem `doc_splitter` previo; en ese caso, completa `file_source_info` con `item_id` y `support_id`. Detalle en la [guía del divisor de documentos](/producto/guias/doc-splitter).
                            enum: ["item"]
                          file_source_info:
                            type: object
                            description: |
                              Referencia al corte del `doc_splitter`. Requerido cuando `file_source: "item"`. Trébol resuelve el sub-PDF internamente; no envíes `bucket`, `key` ni `support_url`.
                            properties:
                              item_id:
                                type: integer
                                description: "`id` del ítem `doc_splitter` que produjo el corte."
                                example: 30829
                              support_id:
                                type: string
                                description: |
                                  Identificador del sub-recurso dentro del ítem referenciado por `item_id`. Para un `doc_splitter` este valor es el `support_id` del corte que Trébol expone en `item_value.split_documents[].support_id`.
                                example: "ds_9f7d3a1c-1c72-4b0f-b8e2-5c9c8b5d4a11"
                            required:
                              - item_id
                              - support_id
            examples:
              Step2Validation:
                summary: Paso 2 - Validación de documentos
                value:
                  items:
                    - type: "doc_validation"
