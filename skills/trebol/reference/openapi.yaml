        register_municipality: { type: string }

    PublicCurpExternalIdentity:
      type: object
      properties:
        search_number:
          type: string
          nullable: true
          description: >
            Número de búsqueda utilizado para la consulta CURP. Puede diferir
            del CURP retornado en los datos del solicitante.
        success: { type: boolean }
        message: { type: string, nullable: true }
        applicant_data:
          {
            $ref: "#/components/schemas/PublicCurpApplicantData",
            nullable: true,
          }
        evidentiary_document_data:
          {
            $ref: "#/components/schemas/PublicCurpEvidentiaryDocumentData",
            nullable: true,
          }
        curp_file:
          type: string
          nullable: true
          description: >
            URL firmada al PDF descargado de RENAPO con la constancia del
            CURP. La URL incluye un parámetro `Expires=…` y caduca; cuando
            expire, vuelve a consultar el endpoint para obtener una URL
            renovada.

    PublicExternalIdentities:
      type: object
      properties:
        curp:
          {
            $ref: "#/components/schemas/PublicCurpExternalIdentity",
            nullable: true,
          }

    V2PeopleData:
      type: object
      properties:
        key_people:
          type: array
          items: { $ref: "#/components/schemas/V2KeyPerson" }
        signatory_groups:
          type: object
          description: |
            Mapa de grupos de roles. Las llaves corresponden a `V2RoleGroupName`:
            "board_members", "executives", "proxies", "auditors".
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/V2SignatoryGroupItem" }
        full_list:
          type: array
          items: { $ref: "#/components/schemas/V2FullPeopleItem" }
        citations:
          type: object
          description: |
            Presente solo cuando se llamó con `?with_citations=true`. Contiene la URL firmada (CloudFront) al artifact de coordenadas en S3, que mapea cada field extraído a sus `bounding_boxes` dentro del PDF original. Ver [Coordenadas de citas](/guia-devs/referencia/coordenadas-citas).
          properties:
            url:
              type: string
              format: uri
              description: |
                URL firmada y temporal. Descarga el JSON cuanto antes; si caduca, vuelve a llamar al endpoint con el flag para obtener una nueva. Si el artifact aún no se horneó para esta verificación, no se devuelve la llave citations.
              example: "https://files.gotrebol.com/{verification_id}/citations/people.json?Expires=…&Signature=…"
          required:
            - url

