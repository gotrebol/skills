          type: object
          additionalProperties: true
          nullable: true
        status: { type: string }
        documents_status: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        email: { type: string, nullable: true }
        signatory_email: { type: string, nullable: true }
        tax_id: { type: string, nullable: true }
        flow_id: { nullable: true }
        notification_hint: { type: string, nullable: true }
        validation_options:
          type: object
          additionalProperties: true
          nullable: true
        details_url: { type: string }
        onboarding_url: { type: string }
        business_name: { type: string, nullable: true }
        friendly_name:
          type: string
          nullable: true
          description: >
            Nombre descriptivo asignado por el usuario al crear la verificación. Permite
            identificar fácilmente la empresa o persona asociada a la verificación.
          example: "Empresa ACME S.A. de C.V."
        comments_legal_review:
          type: array
          items: { type: string }
          nullable: true
        access_token: { type: string }
        options:
          type: object
          properties:
            requires_id_validation: { type: boolean }
          nullable: true
        created_by: { type: string, nullable: true }
        onboarding_terms_and_conditions:
          type: object
          additionalProperties: true
          nullable: true
        lookups_report:
          type: object
          nullable: true
          description: >
            Reporte PDF de auditoría de las consultas públicas externas (SAT, RENAPO, INE, SIGER).
            Presente solo cuando existe un reporte para la verificación; se omite en caso contrario.
            Ver [Consultas públicas externas](/guia-devs/monitorear/consultas-publicas-externas).
          properties:
            url:
              type: string
              description: >
                URL firmada para descargar el PDF (se sirve como adjunto). Es de corta duración y se
                regenera en cada llamada; ver el detalle de uso en
                [Consultas públicas externas](/guia-devs/monitorear/consultas-publicas-externas).
            generated_at:
              type: string
              description: "Fecha y hora (ISO 8601) en que se generó el reporte."
        _kind:
          type: string
          enum: [public_verification, verification]

    CustomItemTypeItemValue:
      type: object
      description: |
        `item_value` de un ítem cuyo `item_type` es un tipo de ítem personalizado (prefijo `cit_`).

        No lleva llaves `cp_<prompt_id>`: ese prefijo es exclusivo de las [extracciones personalizadas](/producto/guias/extracciones-personalizadas) sobre tipos de documento estándar. Aquí los resultados viven en `pipeline`, con un paso por cada proceso configurado en el tipo, identificado por su `process_reference`. Ver [Tipos de ítem personalizados](/producto/guias/tipos-de-item-personalizados#donde-salen-los-resultados).
      properties:
        pipeline:
          type: object
          description: Resultado de cada proceso del tipo para este ítem.
          properties:
            validation:
              type: array
              description: Un paso por regla de validación del tipo. Array vacío si el tipo no tiene validaciones.
              items:
                $ref: "#/components/schemas/CustomItemTypeValidationStep"
            extraction:
              type: array
              description: Un paso por proceso de extracción del tipo. Array vacío si el tipo no tiene extracciones.
              items:
                $ref: "#/components/schemas/CustomItemTypeExtractionStep"
        current_stage:
          type: string
          description: |
            Etapa del pipeline interno en la que quedó el ítem. Es informativa y su lista de valores no es estable: para saber si el ítem terminó usa `item_status` junto con `item_error`.
          example: "extraction"

    CustomItemTypeExtractionStep:
      type: object
      description: Resultado de un proceso de extracción del tipo para este ítem.
      properties:
        process_reference:
          type: string
          description: Etiqueta del proceso de extracción, la misma que definiste al crearlo. Única dentro del tipo.
          example: "extraer_datos_contrato"
        executed:
          type: boolean
          description: "`true` cuando el proceso llegó a ejecutarse para este ítem."
          example: true
        execution_result:
          type: string
          enum: ["success", "error"]
          description: Resultado de la ejecución. Solo aparece cuando `executed` es `true`.
          example: "success"
        value:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            JSON extraído. Sus claves son las `properties` del `json_schema` de la versión que se ejecutó. Es `null` cuando el proceso no se ejecutó o terminó en error.

            Trébol elimina de este objeto, en todos los niveles, las claves que empiezan por `paragraphs_` o `parrafos_` (trazas internas de citas).

    CustomItemTypeValidationStep:
      type: object
      description: Resultado de una regla de validación del tipo para este ítem.
      properties:
        process_reference:
          type: string
          description: Etiqueta de la regla de validación, la misma que definiste al crearla. Única dentro del tipo.
          example: "validar_firmas"
        executed:
          type: boolean
          description: "`true` cuando la regla llegó a evaluarse para este ítem."
          example: true
        execution_result:
          type: boolean
          description: "`true` si la regla se cumplió, `false` si no. Solo aparece cuando `executed` es `true`."
          example: true
        value:
          type: object
          nullable: true
          description: Detalle de la evaluación de la regla. Es `null` cuando la regla no se evaluó o la llamada al validador falló.
          properties:
            identifier:
              description: Identificador interno de la regla evaluada.
              oneOf:
                - type: string
                - type: number
              example: "activeVersionId_87"
            validation_result:
              type: boolean
              description: Si la regla se cumplió.
              example: true
            explanation:
              type: string
              description: Explicación en texto de por qué la regla se cumplió o no.
            variable_name:
              type: string
              description: Nombre del dato del documento que la regla comparó.
            variable_value:
              type: string
              description: Valor encontrado en el documento.
            reference_value:
              type: string
              description: Valor de referencia contra el que se comparó.
            applied_rule:
              type: string
              description: Regla aplicada, tal como la interpretó el validador.

    VerificationFindings:
      type: object
      nullable: true
      description: >
        Hallazgos de la Síntesis de Dictamen.

        Solo lo devuelve `GET /verifications/{verification-id}`, donde siempre está presente.
        El listado `GET /verifications` no incluye este campo: para leer los hallazgos de una
        verificación, consúltala por su ID.

        Es `null` mientras la revisión no se haya ejecutado para esa verificación. Un `items`
        vacío es distinto: significa que la revisión sí corrió y no encontró nada.
      required: [items, computed_at, source]
      properties:
        items:
          type: array
          description: >
            Lista de hallazgos. Vacía cuando la revisión se ejecutó y no encontró problemas.
          items:
            $ref: "#/components/schemas/VerificationFinding"
        computed_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Fecha y hora (ISO 8601) de la corrida que produjo los hallazgos. Es `null` en
            verificaciones antiguas, anteriores a que se registrara este dato.
        source:
          type: string
          enum: [provisional, final]
          description: >
            Origen de la revisión. `provisional`: Trébol la calcula antes de completarse la
            verificación, con un modelo más rápido, y una corrida final puede reemplazarla.
            `final`: Trébol la calcula al completarse la verificación.

    VerificationFinding:
      type: object
      description: Un hallazgo individual de la Síntesis de Dictamen.
      properties:
        severity:
          type: string
          enum: [high, medium, low]
          description: Severidad del hallazgo.
        message:
          type: string
          description: Descripción del hallazgo en lenguaje natural.
        missing_field:
          type: string
          description: >
            Campo o dato faltante al que se refiere el hallazgo, cuando aplica (por ejemplo
            `shareholders`). Se omite cuando el hallazgo no corresponde a un dato faltante.
      required: [severity, message]

    VerificationItem:
      type: object
      properties:
        id: { type: number }
        item_status: { type: string }
        item_order: { type: number }
        item_type: { type: string }
        item_value:
          description: |
            Estructura depende de `item_type`. Ver guía en /guia-devs/respuestas-por-tipo-de-item.

            Además de los campos propios del tipo, incluye una llave `cp_<prompt_id>` por cada extracción personalizada con resultado para ese ítem, donde `prompt_id` es el identificador editable de la extracción. Ver [Extracciones personalizadas](/producto/guias/extracciones-personalizadas).

            Ese prefijo solo aplica a tipos de documento estándar. Un ítem de un tipo de ítem personalizado (`item_type` con prefijo `cit_`) nunca lleva llaves `cp_`: sus resultados viven en `pipeline`, con la forma del schema `CustomItemTypeItemValue`. Ver [Tipos de ítem personalizados](/producto/guias/tipos-de-item-personalizados#donde-salen-los-resultados).
          type: object
          additionalProperties: true
        item_error:
          type: string
          nullable: true
          description: |
            Campo opcional que indica errores públicos relacionados con el procesamiento del ítem. Su valor depende del `item_type` que produjo el error.

            **Comunes a ítems documentales**
            - `password_protected_pdf`: el PDF está protegido con contraseña y no puede procesarse.
            - `get_input_file_info_failed`: falló la obtención de información del archivo de entrada.

            **Específicos de `doc_splitter`** (ver [guía](/producto/guias/doc-splitter) para el listado completo)
            - `unsupported_file_type`: el archivo no es un PDF.
            - `unknown_custom_item_type` / `misconfigured_custom_item_type`: `allowed_item_types` o `client_item_type` referencia un tipo personalizado (`cit_*`) que no existe o no está listo.
            - `no_splits_returned`: el análisis no identificó ningún documento en el PDF.
            - `pdf_slice_failed`: no se pudo leer o recortar el PDF (archivo corrupto o error de descarga del original).
            - `pdf_slice_upload_failed`: se recortaron los sub-PDFs pero falló la subida de al menos uno.
            - `doc_splitter_request_failed`: falló la llamada al servicio de análisis (OCR o AI). Reintentar suele resolverlo.

            **Específicos de `doc_validation`**
            - `invalid_document_type`: el documento no corresponde al `client_item_type` esperado.
            - `ruleset_validation_failed`: al menos una regla del `ruleset` no se cumplió.

            Trata este campo como un `string` opaco: además de los códigos anteriores puede llegar con otros valores para ítems específicos (por ejemplo `prevalidation_failed` en `csf_mx`) o, en errores inesperados, con un mensaje libre en inglés.
        item_internal_status: { type: string, nullable: true }
        item_options:
          type: object
          additionalProperties: true
          nullable: true
        item_ui_options:
          type: object
          additionalProperties: true
          nullable: true
        validation_result:
          type: object
          additionalProperties: true
          nullable: true
        user_event_completed_at: { type: string, nullable: true }
        user_event_name: { type: string, nullable: true }
        user_event_reason: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        item_scope: { type: string, nullable: true }
        original_file_url: { type: string, nullable: true }
        verification_id: { type: number, nullable: true }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
    PublicVerificationItem:
      type: object
      properties:
        id: { type: number }
        item_status: { type: string }
        item_order: { type: number }
        item_type: { type: string }
        item_value:
          description: |
            Estructura depende de `item_type`. Ver guía en /guia-devs/respuestas-por-tipo-de-item.

            Además de los campos propios del tipo, incluye una llave `cp_<prompt_id>` por cada extracción personalizada con resultado para ese ítem, donde `prompt_id` es el identificador editable de la extracción. Ver [Extracciones personalizadas](/producto/guias/extracciones-personalizadas).

            Ese prefijo solo aplica a tipos de documento estándar. Un ítem de un tipo de ítem personalizado (`item_type` con prefijo `cit_`) nunca lleva llaves `cp_`: sus resultados viven en `pipeline`, con la forma del schema `CustomItemTypeItemValue`. Ver [Tipos de ítem personalizados](/producto/guias/tipos-de-item-personalizados#donde-salen-los-resultados).
          type: object
          additionalProperties: true
        item_error:
          type: string
          nullable: true
          description: |
            Campo opcional que indica errores públicos relacionados con el procesamiento del ítem. Su valor depende del `item_type` que produjo el error.

            **Comunes a ítems documentales**
            - `password_protected_pdf`: el PDF está protegido con contraseña y no puede procesarse.
            - `get_input_file_info_failed`: falló la obtención de información del archivo de entrada.

            **Específicos de `doc_splitter`** (ver [guía](/producto/guias/doc-splitter) para el listado completo)
            - `unsupported_file_type`: el archivo no es un PDF.
            - `unknown_custom_item_type` / `misconfigured_custom_item_type`: `allowed_item_types` o `client_item_type` referencia un tipo personalizado (`cit_*`) que no existe o no está listo.
            - `no_splits_returned`: el análisis no identificó ningún documento en el PDF.
            - `pdf_slice_failed`: no se pudo leer o recortar el PDF (archivo corrupto o error de descarga del original).
            - `pdf_slice_upload_failed`: se recortaron los sub-PDFs pero falló la subida de al menos uno.
            - `doc_splitter_request_failed`: falló la llamada al servicio de análisis (OCR o AI). Reintentar suele resolverlo.

            **Específicos de `doc_validation`**
            - `invalid_document_type`: el documento no corresponde al `client_item_type` esperado.
            - `ruleset_validation_failed`: al menos una regla del `ruleset` no se cumplió.

            Trata este campo como un `string` opaco: además de los códigos anteriores puede llegar con otros valores para ítems específicos (por ejemplo `prevalidation_failed` en `csf_mx`) o, en errores inesperados, con un mensaje libre en inglés.
        item_internal_status: { type: string, nullable: true }
        item_options:
          type: object
          additionalProperties: true
          nullable: true
          properties:
            upload_url:
              type: string
              format: uri
              description: URL firmada temporal para subir el archivo del item mediante PUT. Después de subirlo, confirma con options.uploaded_file en PUT /verification-items/{id}.
        item_ui_options:
          type: object
          additionalProperties: true
          nullable: true
        validation_result:
          type: object
          additionalProperties: true
          nullable: true
        user_event_completed_at: { type: string, nullable: true }
        user_event_name: { type: string, nullable: true }
        user_event_reason: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        item_scope: { type: string, nullable: true }
        original_file_url: { type: string, nullable: true }
        citations:
          type: object
          description: |
            Presente solo cuando se llamó con `?with_citations=true` y el item es de tipo acta. Contiene la URL firmada (CloudFront) al artifact de coordenadas en S3. Ver [Coordenadas de citas](/guia-devs/referencia/coordenadas-citas).
          properties:
            url:
              type: string
              format: uri
              description: |
                URL firmada y temporal. Descarga el JSON cuanto antes; si caduca, vuelve a llamar al endpoint con el flag para obtener una nueva. Si el artifact aún no se horneó para esta verificación, no se devuelve la llave citations.
              example: "https://files.gotrebol.com/{verification_id}/citations/sources/{item_id}.json?Expires=…&Signature=…"
          required:
            - url
