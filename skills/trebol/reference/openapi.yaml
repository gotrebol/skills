  /v2/verifications/{verification-id}/corporate-history:
    get:
      operationId: obtenerHistorialCorporativo
      tags:
        - Leer información de la empresa
      summary: Obtener historial corporativo conciliado
      description: |
        Retorna el historial de actas de una empresa, conciliado entre las tres fuentes que lo conocen, con una fila por acta y la trazabilidad de qué fuente aportó cada dato.

        Ninguna fuente ve la empresa completa, y por eso el historial es el cruce:

        - **`siger`** — el folio mercantil. Es el registro de lo que se inscribió: fechas de inscripción, formas precodificadas y el acto tal como quedó asentado. No ve las actas que nunca se inscribieron, y empieza cuando la empresa se digitalizó.
        - **`client_file`** — los documentos que el cliente subió. Prueba que el acta existe y que la tienen, nunca lo que se acordó en ella.
        - **`background`** — los antecedentes que el fedatario narra al inicio de cada acta. Es la única fuente que ve actas que nadie subió y que el registro nunca inscribió, que suelen ser la mayoría de la historia de una empresa.

        Cada acta declara en `sources` qué fuentes la conocen. Un acta que solo trae `["background"]` existe porque otra acta la cita: llega con `cited_by` y con `evidence`, la cita textual que lo sostiene, y nunca se presenta como un hecho sin respaldo.

        **Se calcula al momento de la consulta**, de forma determinística sobre los datos que ya están en la verificación. No hay copia almacenada, así que la respuesta nunca queda obsoleta — y si los datos son parciales, `coverage` lo dice en vez de que el resultado parezca completo.

        **Las tres fechas de un acta** se distinguen porque se confunden con facilidad: `assembly_date` es cuándo se reunió la asamblea, `instrument_date` cuándo un fedatario la protocolizó y `registration_date` cuándo se inscribió el acta en el Registro público de comercio. `timeline_date` es la llave de orden, con precedencia declarada: instrumento, luego inscripción, luego asamblea. Cuando dos fuentes dan valores distintos para la misma fecha gana el expediente, luego el folio y al final los antecedentes: el expediente tiene el documento en mano, mientras que el folio y los antecedentes solo reportan una lectura de él. Si una misma fuente reporta el acta dos veces —un instrumento inscrito en dos folios— se toma la más antigua, solo para ordenarla.

        **Esta versión no reporta discrepancias entre fuentes.** El valor elegido se entrega sin decir que otra fuente decía algo distinto. Cuando dos antecedentes fechan la misma acta de forma diferente, las dos citas quedan visibles en `evidence`, que es donde la diferencia se puede leer directamente.

        **`coverage` declara hasta dónde vemos**, nunca que el historial esté completo. `combined.no_acta_after` es la fecha del acta más reciente del expediente: un cambio posterior a esa fecha no sería visible ni aunque hubiera ocurrido.

        **`document_check`** es un conteo objetivo, sin ranking. Qué documento faltante importa es política de cada cliente, no una conclusión nuestra: el acta entrega `sources`, `changes[].event_type` y `proof_document`, y quien la lee aplica su propio criterio. La lista de faltantes se deriva del historial mismo, filtrando las actas cuyo `sources` no incluye `client_file`.
      parameters:
        - name: verification-id
          in: path
          required: true
          description: ID de la verificación
          schema: { type: string }
      responses:
        "200":
          description: Historial recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PublicResponseCorporateHistory"
              examples:
                corporateHistory:
                  $ref: "#/components/examples/V2CorporateHistoryExample"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - ApiKeyAuth: []

  /v2/verifications/{verification-id}/{entity}:
    get:
      operationId: obtenerSeccionPorIdDeVerificacion
      tags:
        - Leer información de la empresa
      summary: Obtener sección por ID de verificación
      description: |

        Retorna datos públicos v2 de una sección específica de una verificación a partir de su id.

        **Secciones disponibles:**
        - `details`: Detalles de la empresa (información legal, fiscal, registro, etc.)
        - `shareholders`: Accionistas y capital social
        - `people`: Personas clave, apoderados y representantes legales
        - `documents`: Documentos asociados a la verificación
        - `sources`: Fuentes de información (items) que alimentan la verificación
        - `external-lookups`: Evidencia de auditoría de las consultas a fuentes públicas (SAT, RENAPO, INE, SIGER). Ver [Consultas públicas externas](/guia-devs/monitorear/consultas-publicas-externas).

        **Fuentes (`sources`) y extracciones personalizadas:** cuando la cuenta tiene una extracción personalizada activa para el tipo de ítem correspondiente, cada elemento en `data.sources` puede incluir una llave `cp_<prompt_id>` por cada extracción con resultado, donde `prompt_id` es el identificador editable de la extracción personalizada y el valor es el JSON extraído según el esquema de la versión en uso. Más detalle en la guía [Extracciones personalizadas](/producto/guias/extracciones-personalizadas). Los ítems de tipos de ítem personalizados (`cit_*`) no exponen aquí sus resultados: se leen desde el ítem, en `item_value.pipeline`. Ver [Tipos de ítem personalizados](/producto/guias/tipos-de-item-personalizados#donde-salen-los-resultados).

        **Coordenadas de citas:** agrega `?with_citations=true` para obtener URLs firmadas al artifact de coordenadas. Según la sección: `people` y `shareholders` añaden `data.citations.url`; `sources` añade `citations.url` en cada item de tipo acta del array `data.sources`. Detalle completo en [Coordenadas de citas](/guia-devs/referencia/coordenadas-citas).

        <Accordion title="Endpoints v1 (Legacy)">
          <Warning>
            Estos endpoints están en modo legacy. Te recomendamos migrar al endpoint v2 que consolida toda esta funcionalidad en un solo endpoint con mejor estructura de datos.
          </Warning>

          Los siguientes endpoints v1 están disponibles para compatibilidad con implementaciones existentes:

          - [Obtener estatutos de las actas por el ID de Verificacion](/docs/api-reference/leer-información-de-la-empresa-v1/obtener-estatutos-de-las-actas-por-el-id-de-verificacion)
          - [Obtener documentos de la empresa por id de verificacion](/docs/api-reference/leer-información-de-la-empresa-v1/obtener-documentos-de-la-empresa-por-id-de-verificacion)
          - [Obtener apoderados y representates legales de la empresa de las actas por el ID de Verificacion](/docs/api-reference/leer-información-de-la-empresa-v1/obtener-apoderados-y-representates-legales-de-la-empresa-de-las-actas-por-el-id-de-verificacion)
          - [Obtener accionistas de la empresa de las actas por el ID de Verificacion](/docs/api-reference/leer-información-de-la-empresa-v1/obtener-accionistas-de-la-empresa-de-las-actas-por-el-id-de-verificacion)
          - [Obtener datos de prevalidacion de documentos](/docs/api-reference/leer-información-de-la-empresa-v1/obtener-datos-de-prevalidacion-de-documentos)
        </Accordion>
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la verificación
          schema: { type: string }
        - name: entity
          in: path
          required: true
          description: Sección solicitada
          schema:
            type: string
            enum:
              [
                details,
                shareholders,
                people,
                documents,
                sources,
                external-lookups,
              ]
        - name: with_citations
          in: query
          required: false
          description: |
            Aplica a `people`, `shareholders` y `sources`. Si es `true`:
            - Para `people` y `shareholders`: añade `data.citations.url`, una URL firmada al artifact de coordenadas de esa sección.
            - Para `sources`: añade `citations.url` en cada item de tipo acta dentro de `data.sources`.
            Ver [Coordenadas de citas](/guia-devs/referencia/coordenadas-citas).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Sección recuperada exitosamente.
          content:
            application/json:
              schema:
                oneOf:
                  - title: "Detalles de la empresa"
                    $ref: "#/components/schemas/V2PublicResponseDetails"
                  - title: "Accionistas"
                    $ref: "#/components/schemas/V2PublicResponseShareholders"
                  - title: "Personas"
                    $ref: "#/components/schemas/V2PublicResponsePeople"
                  - title: "Documentos"
                    $ref: "#/components/schemas/V2PublicResponseDocuments"
                  - title: "Fuentes"
                    $ref: "#/components/schemas/V2PublicResponseSources"
                  - title: "Consultas públicas externas"
                    $ref: "#/components/schemas/V2PublicResponseExternalLookups"
              examples:
