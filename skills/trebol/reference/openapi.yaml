        id_number_rfc: { type: string, nullable: true }
        id_type: { type: string }
        name: { type: string }
        nationality: { type: string }
        iso_country_code:
          type: string
          nullable: true
          description: |
            Código de país ISO 3166-1 alpha-2 (dos letras) derivado de la nacionalidad. Ejemplos: "MX" para México, "US" para Estados Unidos, "PE" para Perú. Este campo convierte el texto de nacionalidad a su código ISO estándar.
        total_shares: { type: string }
        total_value: { type: string }
        type: { type: string }
        variable_shares: { type: string }
        variable_value: { type: string }
        share_percentage: { type: number }
        aml_validated_at: { type: string, nullable: true }
        aml_validation_status: { type: string, nullable: true }
        aml_risk_category:
          type: array
          items: { type: string }
        aml_data: { type: array, items: { type: object }, nullable: true }
